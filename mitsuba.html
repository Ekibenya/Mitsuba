或魔杖作为媒介，具现化并释放出来。只要组合术式，就能更精炼地显现出来。」罗泽利亚人普遍会注入魔力（常识），魔术需要咏唱，需教育但无适性论有无（军校设「魔术学初级」这类人人可修的常识课）。魔力枯竭会失去意识，个体差异大。已出现的魔术包括对魔障壁、拘束术／锁链魔法（光之锁链）、魔力消灭硬币、结界／封印、灵魂的刻印等；杀伤性魔术几乎已废绝。【卷2】魔术被视为「过时」——「自从障壁诞生以来，魔术就注定要灭亡，现在只是为了贵族们而勉强维持」，实用性近似社交术，颇受贵族千金欢迎（着迷于帅气咏唱与光之花）。魔术科课程含传统咏唱魔术、星象术（占星术）实践、魔道具制作。世人普遍认为「诅咒」不存在（「魔术中没有那么不合理的东西」）——但三叶的力量正是诅咒，见「三叶的诅咒之力」条。","constant":false},{"cat":"社会","title":"魔光石","keys":["魔光石","魔光","对魔牢笼","魔光石粉末"],"content":"蕴含大量魔力的石头，是本世界魔法与科技并存文明的战略资源。用途极广：延命治疗时向体内注入魔力、制作对魔牢笼、护送魔术师手握的石头可展开结界、用作灯具照明的能源、磨成粉末（魔光石粉末）制成枪炮发射药（魔粉药），并嵌入货币纸币中作为对外贸易的价值保障。魔光石采掘事业是投资热点，在战争预期下被认为「必涨」。三叶被投喂的秘药，即以魔光石和小孩尸体采集的触媒混合而成。","constant":false},{"cat":"社会","title":"触媒与诅咒人偶秘药","keys":["触媒","秘药","小孩尸体","诅咒人偶秘药"],"content":"「触媒」是施展魔术的媒介，可与魔杖并列作为将体内魔力具现化释放的媒介。剧情中特指制作投喂三叶那份秘药的原料——该秘药「用魔光石和小孩尸体采集的触媒混合而成」，被持续投喂约十年，正是世人蔑称三叶为「诅咒人偶」的由来（详见「诅咒人偶」条）。","constant":false},{"cat":"社会","title":"对魔障壁与防御屏障","keys":["对魔障壁","对物障壁","突击障壁","反物质屏障","反物质护罩","护盾产生装置","障壁"],"content":"本世界的防御系装置总称。「对魔障壁」防魔术、「对物障壁／对物屏障」防实体，另有「突击用对物障壁／突击障壁」用于强化冲锋，可多重展开、形成闪光墙壁。这类障壁系由普尔梅尼亚的戴安（戴安）等人开发，其诞生被认为宣告了传统魔术的没落。另有更高级的「反物质屏障／反物资护罩」（普尔梅尼亚骑兵突击护体用），以及单兵一次性「护盾产生装置／护身符型对魔·对物护盾」（价格昂贵，非零用钱可及）。运输车辆也消耗「对物屏障」。值得注意的是，三叶的诅咒并非魔术，对魔障壁对她「不发动」，因此各种障壁都被她轻易破坏。","constant":false},{"cat":"社会","title":"七杖制度与蔷薇之杖","keys":["七杖","罗泽利亚七杖","蔷薇之杖","薔薇之杖","七杖家","七家","七贵族","持杖家系"],"content":"「七杖／罗泽利亚七杖」指罗泽利亚的七个持杖家系（七大家族、七贵族），以玫瑰颜色命名分派阀：红桃王家系（红蔷薇＝王家）、黄绿与白黑两大巨头、青（中立）等。已知家名有布鲁洛兹（七家之首）、伊尔洛兹、黑拉罗斯、古林布鲁洛兹（绿玫瑰家）、粉红玫瑰家（卡萨布兰卡远亲）、白玫瑰家、黄玫瑰家、黑玫瑰家。「蔷薇之杖」是七杖家继承者的证明，各家颜色不同；杖会挑选主人，无资质硬握会死，需经「继承仪式」才能握。上流阶级都认得蔷薇之杖的含义。【卷3·革命后】旧七家仅剩「权威、名声、血统之重」，领地多被没收，多名家主被处刑；三叶戏称若算「蓝玫瑰家」（布鲁洛兹）则仍健在。","constant":false},{"cat":"社会","title":"青蔷薇之杖","keys":["青蔷薇之杖","青薔薇之杖","蓝蔷薇之杖","蓝薔薇之杖","青之杖","青之魔杖","蓝玫瑰魔杖","蓝玫瑰之杖","家主之杖"],"content":"布鲁洛兹家家主的信物法杖，是「蔷薇之杖」中的一支。原为前端镶蓝色水晶、水晶内嵌玫瑰花、握把装饰精致而有岁月痕迹的宝物；「从上一代手中继承法杖的人才是正统当家」。【卷1】吉尔莫亚以「灵魂的刻印」擅自将杖传给三叶后，真品前端水晶「变成了混浊的紫色」，他人疑似再也无法触碰。米莉亚娜平时持有复制品，真品对外宣称「在正式的家主决定之前，由城馆保管」，装饰于别馆墙上。【卷2起】成为三叶作为布鲁洛兹家当主的身份三件套之一（阶级章、蓝玫瑰之杖、蓝玫瑰纹章），她政变、出席典礼时佩戴，被戏称「变成紫色的传说中的蓝色魔杖」。三叶更能以此杖发动「让蔷薇盛开」的剧毒之力。","constant":false},{"cat":"社会","title":"灵魂的刻印与继承仪式","keys":["灵魂的刻印","灵魂刻印","继承仪式","赤蔷薇之杖","赤薔薇之杖"],"content":"「灵魂的刻印」是吉尔莫亚对青蔷薇之杖施的一种小魔法，「把你的存在深深地刻在这根手杖上」，蓝光进入三叶体内，使杖认她为主。「继承仪式」则是传承家督／血脉正统性的魔法仪式。【卷2·c5】红蔷薇家（王家）正统血脉象征为「赤蔷薇之杖」，持杖者须行继承仪式；鲁洛伊秘密让马里斯持此杖，其做法正是模仿自吉尔莫亚卿当年对三叶的手法。","constant":false},{"cat":"社会","title":"不老秘术","keys":["不老秘术","不老的处置","不老","维持年轻","延命"],"content":"「不老秘术／不老的处置」是尼科雷纳斯（尼可雷纳斯）开发、以自身为第一实验体的维持年轻之术，禁止外传，其他实验者全数死亡。尼科雷纳斯本人已接受此处置。【卷3】明确「不老」已由尼可实现，但目前唯她一人受益。此外，王魔研究所也涉及「延长寿命」的魔法（如以魔光石注入魔力延命），与三叶被熬煮十年而「重返世界」的复生术式属同一技术脉络。","constant":false},{"cat":"社会","title":"大轮历与大轮教","keys":["大轮历","大轮教","大轮教会","大轮之神","大轮神","历法"],"content":"「大轮教／大轮教会」是罗泽利亚的主流宗教，信奉「大轮之神（大轮神）」，教义主张遗体回归大地以待转生。其纪年法为「大轮历」，随剧情推进：【卷1】五八五年 →【卷2】五八六年 →【卷3】五八七年（十二月凯旋）→ 五八八年，三叶任期设定至六〇七年。新年在一月，是年度分界与军校升级的时点，会举办舞会。（注：三叶心中「四月樱花」的升学印象与此世界不符，暗示她带有异世界记忆。）","constant":false},{"cat":"社会","title":"食物与饮食","keys":["食物","饮食","面包","葡萄酒","红酒","断头台配套","盐糖","针面包"],"content":"饮食强烈体现阶级差异。贵族席：淋酱汁的牛排、色彩缤纷蔬菜、蛋糕、浓汤、普尔梅尼亚产高级葡萄酒（「宝石般的紫色液体」）、普美利亚威士忌『像酒一样好喝的水』；市民／军校席：柔软面包蘸汤、发黑蔬菜、芝士、酸腌黄瓜、烤豆子、便宜且极涩的红酒、牛奶（三叶厌恶）。其他出现的食物：苹果汁、瓶装果汁、西红柿、冰而苦的茶、里里埃产红茶、咖啡（加牛奶砂糖）、炖菜（里特贝尔食堂，三叶心心念念）、肉干（波多凯基）、跨年粥、蜂蜜酒（金黄、甜、度数高，曾被吹捧为不老长寿秘药）。军校伙食依赖食堂，假期需自备三天份食材。特殊：「盐糖」是难吃但获尼科雷纳斯背书、军校允许的补给用咸味糖；「针面包」是三叶发明的酷刑「料理」（面包内藏一百根针）。断头台可搭配从绿化教徒没收麻药制成的「止痛药」使用。","constant":false},{"cat":"社会","title":"服装","keys":["服装","军服","制服","礼服","白大衣","白袍","女仆装","斗篷长袍","睡衣"],"content":"常见服饰：王都流行的礼服（束腰难受）；军官学校制服（类军服、有军刀、军帽、皮鞋，另有步兵科长帽制服、儿童用军乐队军服）；军人礼服（出席宫廷场合用）；魔术师的连帽斗篷长袍及带纹章的服装；尼科雷纳斯与王魔研常穿带纹章的白大衣／白袍；女仆装；来宾佩勋章肩章、贵妇用昂贵扇子遮嘴。三叶相关：幽禁时穿工作服般朴素裤子，最爱触感极佳的睡衣；出塔后穿沾满血迹的罗泽利亚军服；当主身份三件套为阶级章＋蓝玫瑰之杖＋蓝玫瑰纹章；典礼时戴王冠、化妆盛装，微服时穿便服戴朴素兜帽。另有类似和服的衣服（藤崎故乡寄来）、绿化教徒身上的绿布／绿色头巾。","constant":false},{"cat":"社会","title":"科技水平","keys":["科技","马车","写实画","相机","火焰喷射器","断头台","怀表","无电视"],"content":"本世界处于火器时代与魔法科技并存的阶段。交通靠马车（没有魔法地毯或飞天马、没有汽车）；无电视、无SNS、无相机，记录影像靠画家绘制的「写实画」（宴会有画家即时记录），水可用魔术冷却，有水壶与玻璃杯，怀表是高级品。火器：前装大炮、散弹、榴弹、带刺刀的燧发式／线膛枪、魔光枪（详见相关条）。魔法科技产物：魔光石制灯具与发射药、魔道具、魔力驱动轨道运输车（发射式运输车辆是疯狂试作）、魔光液筒（火焰喷射器部件）。王国魔术研究所是研发中枢，产出断头台、火焰喷射器（诱爆式火焰喷射器）、新型炮弹、多枪身武器、抛弃式长距离大炮等；也曾被要求优先研究生发剂与勃起障碍药而成丑闻。医疗方面有医生与精神科医生，止痛剂可致瘾如毒品，截肢防侵蚀但义肢义足昂贵难普及，骨折只能「带去看医生」。","constant":false},{"cat":"社会","title":"魔光枪与制式枪械","keys":["魔光枪","尼可参式长枪","参式长枪","三式长枪","尼可参式滑膛枪","参式突击枪","肆式","四式","线膛枪"],"content":"「魔光枪」是用魔光石粉末（魔粉药）发射铅弹的枪械总称，通称长枪／短枪。型号世代：尼可壹式、参式、参式突击、四式／肆式。现役制式「尼可参式长枪（三式长枪／参式长枪／尼可参式滑膛枪）」较重、可当钝器，内置魔力储藏装置（魔力贮藏装置），免每发装填魔粉药；「参式突击枪」是轻量化衍生型，储弹少、重突破力；「肆式／四式」为预定配备精兵的次世代长枪，有膛线（线膛枪）。三叶完全学不会魔术，唯一会做的是向尼可参式滑膛枪注入魔力（「实际上只是有意识地用力呼吸」）。","constant":false},{"cat":"社会","title":"魔粉药与咒纸","keys":["魔粉药","魔粉","术纸","咒纸","咒纸棒","咒术纸"],"content":"「魔粉药／魔粉」是以魔光石粉末制成的枪炮发射药，是化学与魔法结合的产物，由王魔研持续改良。「术纸／咒纸」是发动术式的纸；「咒纸棒」即火炮点火用具（大炮点火棒），贴于火炮点火处可击发／引爆——三叶亦以咒纸作为击发火炮的魔法道具。","constant":false},{"cat":"社会","title":"炮弹与要塞攻略炮","keys":["炮弹","榴弹","散弹","戴安要塞攻略炮","新型炮弹","大炮"],"content":"炮用弹药分三种：炮弹、榴弹、散弹。「榴弹」是填入魔力由大炮发射、落地炸裂散布铁片的昂贵弹药。大炮本身很贵，训练时用空炮，装备多为淘汰品。特殊兵器：「戴安要塞攻略炮」是普尔梅尼亚一次性超大口径攻城炮（约五发寿命）；「新型炮弹」是王魔研的机密兵器，尼科雷纳斯否认其存在，三叶暗中注力使之成为定时炸弹，并与「紫色雾霭」「神秘瘟疫」相关联。","constant":false},{"cat":"社会","title":"断头台","keys":["断头台","人道处刑器具","公募","公开招募"],"content":"三叶向王魔研「公募（公开招募）」提交的斩首装置，是全书标志性发明。原理：「只要拉动绳子，脑袋就会掉下来。只要更换刀刃，就能重复使用。」附首桶、有安全装置，不需执行人技术、善后轻松、造价可压低，可搭配止痛药「根据罪状给予止痛的慈悲」，也可调成让犯人仰视刀刃以施加恐惧。三叶坚称名字必须叫「断头台」，并刻上白三叶草纹章装饰。它是公募合格第一号·最优秀品，将在全国配置并送贝利兹宫殿御览。三叶自称此为「复活过去伟人的技术」「借用先人的智慧制作」。【卷2起】进入量产体制、推广至罗泽利亚各地；【卷3】成为革命肃清的主力刑具，甚至拟对外出口。（注：王魔研的公募课题共四项——革新的新型武器、革新的移动手段、革新的携带粮食、人道的处刑器具。）","constant":false},{"cat":"社会","title":"三叶的诅咒之力","keys":["诅咒","腐蚀之力","让蔷薇盛开","失望必杀剑","失望剑","紫剑","紫色雾霭","气愤而死"],"content":"三叶的核心能力并非魔术而是「诅咒」——世人本认为诅咒不存在、无防诅咒之术，对魔障壁对它「不发动」，开枪命中眉间／身体亦无效。表现形式：触碰即令活人身体腐烂（腐蚀之力）；缠绕／注入魔力形成紫色雾气与紫色光弹（弹道完美、贯穿）；隔空刺针、以荆棘藤蔓缠杀、令反射物映出幻觉；引发紫色泡沫融化人体的「神秘瘟疫」（内脏腐烂脱落、吐血而亡、接触吐血传染）。以蔷薇之杖发动的大规模剧毒攻击称「让蔷薇盛开」，可化人为蔷薇养分、全灭大军。诅咒有代价机制、可令对方与自己一同「睡着」，且「恶意加倍返还」。三叶给自己的紫色光刃起名「失望必杀剑／失望剑紫剑」（出塔后一度无法再使用）。她对外把议场三十人猝死说成「气愤而死」（「当然，这是骗人的」）。","constant":false},{"cat":"社会","title":"诅咒人偶（绰号）","keys":["诅咒人偶","咒术人偶","毒人偶","玩具人偶","蓝色恶魔","蓝色的恶魔","女神大人","国民之母"],"content":"世人对三叶的诸多称呼，随立场与阶段变化。蔑称／恐惧称呼：「诅咒人偶／咒术人偶／毒人偶」（因她被投喂魔光石＋小孩尸体触媒秘药约十年，绰号由米莉亚娜传开，士兵与敌方皆称之，视她为「杀也杀不死的怪物」）、「蓝色恶魔」（绿化教徒等敌人用）、「忌子／禁忌之子」（老家称呼）、「青霉／青霉菌」（讽刺她把绿化教徒骂作霉菌）。三叶亦自嘲为「玩具人偶」（发条驱动、快停时再上发条）。崇拜称呼：精神崩溃的伯爵夫人与阿尔斯托罗称其「女神大人」；【卷3】被神化后，报纸与民众尊称「国民之母」，合唱队高唱赞颂「神圣、伟大又美丽的母亲三叶大人」。","constant":false},{"cat":"社会","title":"名誉姓与代理家主","keys":["名誉姓","荣誉姓氏","名誉姓氏","代理家主","当主","当家"],"content":"「名誉姓（荣誉姓氏／名誉姓氏）」是把贵族家名（如布鲁洛兹）作为荣誉授予的姓，属王家与七家的特权，可保留、买卖或被剥夺。三叶被剥夺过布鲁洛兹之姓，成年时尼可承诺想办法归还。「代理家主」是正式家主决定前的代理当家职位（米莉亚娜曾任）；「当主／当家」即贵族家督。【卷2起】三叶正式成为布鲁洛兹家当主（七家之一）。","constant":false},{"cat":"社会","title":"三叶之印与三叶党","keys":["三叶之印","三叶徽章","三叶党","三叶点数","金色三叶","三叶草纹章","白三叶草"],"content":"【卷2·c4起】「三叶之印／三叶徽章」是三叶党信徒佩戴的会发紫光的徽章；「三叶党」是崇拜三叶的信徒团体，其战斗部队正式名称为「难民大队」。三叶的个人纹章是白三叶草（四叶／三叶草纹章），常刻于断头台等物上作装饰。（另有玩笑体系「三叶点数／金色三叶」「善行点数」，是三叶心中给人打好感分的自创玩笑。）","constant":false},{"cat":"社会","title":"勋章与纪念碑","keys":["勋章","三叶草勋章","六月革命蔷薇勋章","革命勋章","阿尔卡迪亚纪念碑","纪念碑","纪念彩券"],"content":"【卷3】共和国的荣典与纪念工程。勋章：「六月革命蔷薇勋章」为共和国正式勋章，饰以象征国家的蔷薇花、造型豪华；「三叶草勋章（三叶勋章）」由三叶亲手制作，分军事功勋奖与文化功勋奖，宝石会发紫光、是受诅咒的逸品；「革命勋章」为降低成本量产、发给士兵与难民大队的限定品。【卷3·c4】「阿尔卡迪亚纪念碑」的建造经费在财政严峻、本年度预算已分配完毕的情况下，靠报纸募款与出售纪念彩券筹措。","constant":false},{"cat":"社会","title":"文化与日常风俗","keys":["文化","风俗","亮相派对","お披露目","踏绘","笼中鸟","愚人节","赞颂三叶合唱"],"content":"写诗、喝茶、品酒被视为优雅的贵族生活。风俗细节：「亮相派对（お披露目）」——为康复千金举办、致辞、发纪念酒干杯；干杯／庆功（「胜利美酒」「胜利的一根烟」）文化；假期互赠礼物的送礼文化（桑德拉送三叶钢笔）；音乐家现场演奏、军乐（横笛与鼓）、行进曲『赤红玫瑰永垂不朽』。忠诚测试：「踏绘」式仪式（踩烂／踩碎小册子以自证清白，三叶如此命名），另指否定免罪符+朗读亵渎文章换面包的弃教仪式。节日：一月新年办舞会；四月一日是这个世界的愚人节；六月六日是三叶生日。童谣『笼中鸟』是三叶爱哼的曲子（「据说光是听到就让人浑身发冷」）。【卷3】个人崇拜盛行，出现大量赞颂三叶的合唱曲（如『三叶大人颂歌第一乐章』），阿尔斯托罗作画作歌作曲美化神圣化三叶，凯旋时群众撒纸花、高唱国歌万岁。三叶常引「伟人也说过」「言语就是子弹」等名言塑造后世形象。","constant":false},{"cat":"社会","title":"隔离塔","keys":["隔离塔","幽禁","封印塔"],"content":"布鲁洛兹领内的幽禁设施，三叶曾被长期关押于此。塔内昏暗、无时钟、无照明细节，三叶在此穿工作服般的朴素裤子。塔上被施有结界／封印，尼可曾警告勿对塔使用魔术。","constant":false},{"cat":"社会","title":"异国术语（阴阳师·死相）","keys":["阴阳师","死相","介错","藤崎故乡"],"content":"来自藤崎故乡（异国）的东方风术语。「阴阳师」是藤崎故乡对魔术师的称谓；「死相」是三叶能感知的死亡预兆（「脸上出现死相了」）；「介错」是三叶对以枪托处决俘虏的说法。这些多带有三叶／藤崎的异世界记忆色彩。","constant":false},{"cat":"社会","title":"神的慈悲（毒品）","keys":["神的慈悲","神之慈悲","毒品","麻药","止痛药"],"content":"「神的慈悲（神之慈悲）」是绿化教使用的毒品，由一种开花植物制成、可私造、无强烈气味（「该说是清爽，还是香香的味道呢」是三叶的独有感知）；可如香烟般吸食，接触者会「看见神」、产生幻觉、精神错乱乃至自爆。绿化教靠散播它拉拢贫困阶层。三叶主张立法「使用者、贩售者、制造者全部判处死刑」「从源头斩断」，但严格区分医疗镇痛剂——以「吗啡和海洛因的区别」为喻（吗啡有条件允许、海洛因绝对不允许）。从绿化教徒处没收的麻药经加工可制成「止痛药」，作为断头台的配套慈悲方案。","constant":false},{"cat":"剧情","title":"卷1·EP1·目覚め（觉醒）","keys":["觉醒","目覚め","苏醒","两道光","隧道","布鲁洛兹城馆","露比娜","皮埃尔"],"content":"本话为全书开篇。原前世意识在只有噪声的电视前百无聊赖，决定离开时世界天旋地转，与两道来历不明的光混合，穿过黑色隧道、冰冷蓝海、紫色雾霭抵达白色出口，浮现『这个世界是为了我而转动』的念头——完成转生。回神时被『白胡子时髦大叔』抱在怀里：这是父亲吉尔莫亚。三叶出生后昏迷约十年，此刻首次恢复意识，喉咙剧痛发不出声，吉尔莫亚狂喜落泪、慌乱提到『魔术不完全』并首次提及尼科雷纳斯之名。三叶问出核心问题『我到底是谁』，得知自己是三叶·布鲁洛兹·克劳伯，克劳伯家千金、七杖之一布鲁洛兹之名的继承人。她照镜见到银发蓝眼如人偶的自己，佣人露比娜跪求『不要吸走灵魂』，被三叶随口一句吓晕；女仆们惊叫逃散，只剩管家皮埃尔。\n本话结束时：三叶苏醒卧于布鲁洛兹城馆自己的房间，身体僵硬；吉尔莫亚在世且极度溺爱；米莉亚娜尚未登场。首次出现人物/概念：吉尔莫亚、露比娜、皮埃尔、尼科雷纳斯（仅提名）、七杖、克劳伯家、魔光石与触媒。\n此时尚未发生：吉尔莫亚尚未把蓝蔷薇之杖传给三叶，也尚未在亮相派对被毒杀。","constant":false},{"cat":"剧情","title":"卷1·EP2·青い薔薇（蓝蔷薇）","keys":["蓝蔷薇之杖","青薔薇","灵魂刻印","亮相派对","米莉亚娜","藤崎","格里埃尔","普尔梅尼亚葡萄酒"],"content":"本话交代身世并完成第一次谋杀。皮埃尔向三叶透露：生母第一夫人藤崎（异国阴阳师）产后去世，吉尔莫亚倾家荡产、借王魔研之力用魔光石与小孩尸体触媒延命十年；继母米莉亚娜（原第二夫人、伊尔洛兹家出身）分居别馆。吉尔莫亚取出蓝蔷薇之杖，念咒放出蓝光完成『灵魂刻印』让三叶认主继承。\n视角转米莉亚娜：她已收买皮埃尔等全部佣人，接伊尔洛兹家（王党派首领）与国王鲁洛伊之约要让格里埃尔继承；得知杖已归三叶，遂决定在下月亮相派对了断——交皮埃尔毒药下入吉尔莫亚酒杯（酬金一百万贝尔），并散布『诅咒人偶咒杀双亲』的恶评。派对当日，吉尔莫亚饮下混入普尔梅尼亚葡萄酒的毒，致词途中吐血倒地身亡，众人归咎于三叶的诅咒。\n本话结束时：吉尔莫亚死亡，米莉亚娜就任代理家主，三叶被幽禁隔离塔，青之杖由城馆保管。次日皮埃尔亦离奇中毒身亡（官方称殉死，米莉亚娜存疑）。首次出现：米莉亚娜、藤崎、格里埃尔、米格尔、伊尔洛兹家、诅咒人偶之名、隔离塔。\n此时尚未发生：三叶尚未在塔中引发连环怪死，尚未被送往军官学校。","constant":false},{"cat":"剧情","title":"卷1·EP3·悪意は巡るよ（恶意循环）","keys":["隔离塔","小瓶子","笼中鸟","十三人怪死","尼科雷纳斯","不老秘术","榴弹","失望必杀剑"],"content":"本话中三叶在隔离塔的恶意环境下首次显现异能。她被关约一周，从裤袋掏出骚动中偷捡的小瓶（疑似毒药），因渴望甜味将透明液体一饮而尽却毫发无伤。之后她敲门玩节奏游戏、拔木刺做『前卫艺术』刺椅，身体渗出紫色毒光，破解魔术师的多重对魔障壁与拘束术，并以地板冒出的紫发绑椅『诅咒』辱骂她的人。塔中累计十三人离奇死亡（警备兵三、佣人十），尸体化为诡异雕像或被侵蚀成紫色。\n视角转米莉亚娜与尼科雷纳斯会谈：尼科雷纳斯（王魔研所长、不老秘术研究者、大炮发明者，年过六十五仍维持三十多岁外表）称三叶是『隐藏惊人威力的榴弹』，体内累积某种以恶意反击恶意的东西，强烈拒绝处死她，并献策把她丢进军官学校冷门科系、送激战区战死。米莉亚娜发现所持真品青蔷薇之杖前端水晶已由蓝变浊紫。\n本话结束时：三叶仍在塔中，尼科雷纳斯的军校提案被米莉亚娜『积极考虑』。首次出现：尼科雷纳斯正式登场、不老秘术、榴弹之喻、失望必杀剑（心声萌芽）、王都贝尔。\n此时尚未发生：尼科雷纳斯尚未亲赴塔中邀约，三叶尚未抵达王都。","constant":false},{"cat":"剧情","title":"卷1·EP4·士官学校（军官学校）","keys":["军官学校","尼可所长","囚车","大轮历585年","帕鲁克","炮兵科","监护人","王都贝尔"],"content":"本话三叶入学。尼科雷纳斯亲赴隔离塔，自报为治疗者与吉尔莫亚托付的监护人，昵称『尼可所长』；确认三叶生日六月六日、刚满十一岁，试探她的异世界记忆（三叶承认偶有），并邀她入罗泽利亚王立陆军军官学校。三叶因厌倦无聊而应允，随手写下『三叶·克劳伯』（布鲁洛兹名誉姓被暂剥夺）。次日她乘王魔研特制对魔术师囚车赴王都，却徒手把铁笼锈蚀崩塌，途中得知当前为大轮历五八五年六月十三日、王都贝尔是罗泽利亚首都；她将『花都』误联想为前世的巴黎，确认此为异世界。\n视角转校长帕鲁克：军官学校为前任国王所设、学制四年，贵族选魔术科骑兵科、市民被塞进步兵科炮兵科（大炮为尼科雷纳斯发明、去年新设）。尼科雷纳斯强推三叶入学，帕鲁克视她为烫手山芋。面谈中三叶自愿选定炮兵科，理由『大炮破坏力最强、发射很好玩』。\n本话结束时：三叶抵达王都贝尔、正式入学炮兵科，帕鲁克只求尽快让她毕业。首次出现：帕鲁克、军官学校、大轮历、炮兵科、巴黎（前世记忆）、军刀化紫剑。\n此时尚未发生：三叶尚未见到教官加鲁多与同学克萝内、桑德拉，尚未开始上课。","constant":false},{"cat":"剧情","title":"卷1·EP5·砲弾が世界を変える（炮弹改变世界）","keys":["加鲁多","克萝内","桑德拉","里马斯","食堂踩头","学生指导室","欢迎会","帕雷亚纳"],"content":"本话为入学第一天，三叶结识核心同伴。校长把她交给炮兵科教官加鲁多。教室自我介绍时她说要『杀掉很多人』被加鲁多纠正为『为国家效力』；全班回避她，只有金发女生克萝内主动招呼她同坐，眼镜女桑德拉冷眼旁观。历史课后食堂冲突：三叶对伊尔洛兹家未来家主里马斯的随从说出死相，被随从踩头，她握住其脚踝暗中『祈祷痛苦』，随从骨头如烧灼般惨叫瘫倒（外观无异常）。三叶因此被叫进学生指导室，加鲁多以『无咏唱、无外伤』为她辩护脱罪。放学后桑德拉发表狂热的共和主义演说、邀她入伙；夜里克萝内在宿舍开欢迎会通宵喝酒，两人正式结为朋友，三叶灌醉克萝内而自己不醉。\n本话结束时：三叶与克萝内、桑德拉同住女生房并结交，被踩头随从重伤昏迷，里马斯记恨在心。首次出现：加鲁多教官、克萝内（帕雷亚纳没落前贵族）、桑德拉（共和主义者）、里马斯·伊尔洛兹、学生指导室、诅咒人偶恶评在校流传。\n此时尚未发生：三叶尚未首次射击引发火灾，伊尔洛兹家尚未派暗杀者。","constant":false},{"cat":"剧情","title":"卷1·EP6·明日に向かって撃ってみよう（朝着明天开一枪）","keys":["魔光枪","尼可壹式","占星术馆火灾","兜帽暗杀者","毒蛇","希尔鲁德","厨师之死","禁书"],"content":"本话三叶魔力失控暴露并挺过暗杀。射击课梳理军事史（尼科雷纳斯发明魔光枪破对魔障壁使罗泽利亚翻身）；三叶首次射击时枪身冒紫雾，抢先发射把缠紫雾的石子射穿稻草人、命中魔术科建筑引发火灾，几乎烧到占星术馆。她因此二度进指导室（事件定性为枪支故障走火，教官贾多减薪，三叶禁闭一天）。禁闭中她读桑德拉赠的禁书（塞贝尔著《王、贵族、市民，以及霉菌》），随后兜帽暗杀者（伊尔洛兹家密探集团『毒蛇』所雇）贿赂监督官离席，要求她解除对里马斯友人的『诅咒』遭拒，向她额头开枪——三叶中弹不死撑起身，暗杀者液化成紫色肉块。\n视角转伊尔洛兹当家希尔鲁德（米莉亚娜之兄）：得暗杀失败报告，改令『毒蛇』收买厨师下毒，结果厨师喝下自己做的毒汤内脏腐烂而死，收贿监督官发疯上吊（遗书『不想融化』）。校长帕鲁克面对连锁怪死，谋划派三叶去镇压绿化教徒立功。\n本话结束时：三叶中弹存活，加害者接连反噬横死，恶评升级为实质恐惧。首次出现：魔光枪/尼可壹式·参式长枪、毒蛇、希尔鲁德、绿化教徒。\n此时尚未发生：三叶尚未复课参加行进训练，尚未初次休假游王都。","constant":false},{"cat":"剧情","title":"卷1·EP7·謹慎が明けて（禁闭结束）","keys":["行进训练","军乐太鼓","王都观光","建国之父石像","玛丽安娜","贝利兹宫殿","红蔷薇","卡萨布兰卡"],"content":"本话三叶禁闭结束后复课并首次真正休假。禁闭莫名延长三天后归班，克萝内、桑德拉转述职员与厨师自杀的新传闻（最终又算在三叶头上）。当日与步兵科联合行进训练：炮兵三人一组推轮式旧炮（三叶居中），突击号响后三叶全速冲刺超越三成步兵、夺炮兵科第一，被教官训诫『突击要配合周围』但免罚；实力盖过流言，恶评转为畏惧。餐厅侍者因厨师之死对她极度恐惧、单独备餐。\n休假日克萝内带三叶游王都贝尔：参观『罗泽利亚建国之父』石像广场（仿制品，真品在宫殿），得知温柔王妃玛丽安娜（出身敌国卡萨布兰卡大公国、与国王鲁洛伊政治联姻但感情好）曾提议让贫民接触艺术却适得其反、激化阶级仇恨；又绕到贝利兹宫殿，见门后列十门大炮示威（差点暴动后国王夸示武力反激怒市民），西侧偷看王妃庭园满种国王亲手栽培的红蔷薇。一辆布鲁洛兹家纹章马车驶入宫殿。\n本话结束时：三叶站稳脚跟、与克萝内感情加深，对宫殿政局仅旁观。首次出现：王妃玛丽安娜、卡萨布兰卡大公国、贝利兹宫殿、军乐太鼓、建国之父石像。\n此时尚未发生：三叶尚未参加大炮实弹演习。","constant":false},{"cat":"剧情","title":"卷1·EP8·素敵な兵器（美妙的兵器）","keys":["大炮演习","炮兵演习场","榴弹","散弹","空炮","普美利亚国旗","咒纸棒","抢便当"],"content":"本话为第1卷收束，三叶首次参加大炮实弹演习。军校生活满一个月，演习日早晨克萝内与桑德拉争吵升级到桑德拉掏短枪，三叶充当两人中间人打断争吵。全班扛炮行军约两小时抵达王都外炮兵演习场，途中一组失衡翻车需现场修理。休息时三叶发现没人告知便当自带，脱口欲『抢夺』瘦学生的饭，被克萝内按肩制止、两位同伴分食物给她，她为自己的念头羞愧。\n炮弹讲义介绍三种炮弹——炮弹（纯铅弹、破障壁）、榴弹（内储魔力爆炸、成本为普通弹十倍、须魔术师填充）、散弹（近距散射、射程极短）；三叶想自填空榴弹、给大炮注入自身魔力均被教官阻止（『别把宅邸炸飞』）。实弹演习以岩石堆与普美利亚帝国国旗为靶，三叶握咒纸棒点火，第一发未命中；随后空炮演习重复五次，她因无趣打瞌睡被吐槽。\n本话结束时：第1卷落幕，三叶完成炮兵基础训练、与两位同伴关系稳固，对自我同一性的怀疑持续加深。首次出现：炮兵演习场、榴弹/散弹分类、假想敌普美利亚帝国、咒纸点火棒。\n此时尚未发生：三叶尚未被投入实战（镇压绿化教徒或共和派），相关剧情留待后续卷次。","constant":false},{"cat":"剧情","title":"卷1·总览(EP1-8)","keys":["卷1总览","三叶物语","诅咒少女","死之轮舞","转生","布鲁洛兹","炮兵科","诅咒人偶"],"content":"第1卷《呪いの少女と死の輪舞》主线时间轴（EP1-8，大轮历五八五年）。EP1：前世意识与两道光混合转生入布鲁洛兹家昏迷十年的三叶体内，苏醒见父吉尔莫亚。EP2：吉尔莫亚传蓝蔷薇之杖给三叶，继母米莉亚娜勾结伊尔洛兹家与国王鲁洛伊，在亮相派对借皮埃尔下毒杀吉尔莫亚，三叶背锅被幽禁隔离塔，皮埃尔次日离奇死。EP3：三叶在塔中显现紫色异能，引发十三人连环怪死；尼科雷纳斯拒绝处死她、献策送她入军校冷门科系战死。EP4：尼科雷纳斯邀三叶入罗泽利亚王立陆军军官学校，乘囚车赴王都贝尔，自选炮兵科。EP5：入学结识教官加鲁多与同伴克萝内、桑德拉，食堂踩头冲突中『诅咒』重伤里马斯随从。EP6：射击失控引火灾，伊尔洛兹家『毒蛇』暗杀者与下毒厨师接连反噬横死。EP7：复课行进训练夺第一，首次休假游王都贝尔（建国之父石像、王妃玛丽安娜、贝利兹宫殿红蔷薇）。EP8：首次大炮实弹演习，学炮弹分类。\n贯穿主线：三叶转生后凭『以恶意反击恶意』的紫色异能屡屡令加害者横死，恶评从『诅咒人偶』升级为实质恐惧；核心悬念是她对自我同一性的怀疑（『正在思考的我真的是我吗』）。\n此时尚未发生：三叶尚未被投入实战，异世界记忆与体内『某种东西』之谜尚未揭晓，均属后续卷次。","constant":false},{"cat":"剧情","title":"卷1·EP9·清爽的霉菌","keys":["EPISODE9","清爽的霉菌","爽やかなかび","亲手掌握自由","踏绘","共和派演说","绿化教自爆","燃料四处散落"],"content":"秋天假日、考试后三个月。三叶人生首次独自逛王都，撞见广场上共和派演说（口号「我们市民才是国家」），被警备兵盘问、以「踏绘」撕碎踩烂反体制小册子《亲手掌握自由》。她迷路进昏暗小巷（墙上『引导我们吧』与肮脏绿旗），目击绿化教徒抱榴弹自爆、濒死女教徒被警备兵枪剑刺死。此话她首次确立核心感知——绿化教徒身上散发「清爽刺鼻的气味」，并提出王都局势「燃料四处散落」的判断。同话三条幕后线并行：尼可雷纳斯（研究所所长）否决校方对三叶的警告、批准「十一岁参加实战（附条件）」，独白透露他投入金钱魔力让「素体」复活、感谢已故吉尔莫亚，副所长报出三叶入学半年牵连死亡三十三人。米莉亚娜在贝利兹宫殿舞会借刀杀人失败（伊尔洛兹家『毒蛇』半毁）、与兄长希尔鲁德断交；玛丽安娜王妃决定亲自调查并援助三叶。\n话末状态：三叶回宿舍，小册子被桑德拉发现，遭一小时「自由」说教；克萝内外出约会；桑德拉在宿舍自习；尼可雷纳斯在魔术研究所往冷咖啡加奶搅拌（隐喻三叶人格融合）；米莉亚娜留在舞会盘算。\n首次登场：共和派、绿化教会、魔粉药与新型线膛枪计划、尼可雷纳斯、副所长、米莉亚娜、希尔鲁德、贝耶尔伯爵、国王鲁洛伊、王妃玛丽安娜、王子马里斯、格里埃尔。\n此时尚未发生：三叶尚未参加实地研修，尚未遇见塔尔克，绿化教气味尚未用于实战。","constant":false},{"cat":"剧情","title":"卷1·EP10·不受欢迎的研修生","keys":["EPISODE10","不受欢迎的研修生","招かれざる研修生","实地研修","波特库克","加鲁多","莫兰上尉","塔尔克","里特贝尔","治安维持局"],"content":"入学半年。军官学校长跑与徒手格斗训练：克萝内（约180cm）压制不到140cm的三叶，三叶自嘲应活用枪炮；她详述绿化教徒的「薄荷般清爽气味」感知，克萝内笑她「你是狗吗」。次日朝会宣布克萝内、桑德拉、三叶三名炮兵科学生获校长推荐参加一周实地研修；桑德拉以「个人因素」拒绝（她只为学习、志在当议员）。三叶从三个去处中选「治安维持局」（可痛揍绿化教徒），克萝内选东部方面军国境前线。视角转至里特贝尔市驻地：五十岁市民出身、能力平平的莫兰上尉抱怨要给「十一岁孩子」当保姆，把三叶全权丢给副长塔尔克少尉。塔尔克在士官学校步兵科优异毕业、深受市民信赖、已被推荐为莫兰继任者。三叶抵达时握手对塔尔克说「少尉真是个『爽朗』的人呢」——已暗示她嗅出他是绿化教徒。护送的王魔研魔术师反常地警告莫兰「务必不要刺激她」「一周后请务必平安无事」，逃也似地离开。\n话末状态：三叶到达里特贝尔驻地，塔尔克带她去食堂（后揭为绿化教联络点）；克萝内前往东部国境；桑德拉留校。\n首次登场：波特库克（松饼君）、加鲁多教官、莫兰上尉、塔尔克少尉、汉娜（未出场，后揭）、里特贝尔市、哈尔吉奥（未出场）、斯兰姆、战争税等税制、大轮教徒（未出场）。\n此时尚未发生：伏击尚未开始，三叶尚未「战死」，塔尔克身份尚未公开揭穿。","constant":false},{"cat":"剧情","title":"卷1·EP11·愿神的引导与我们同在","keys":["EPISODE11","愿神的引导与我们同在","神の導きがあらんことを","哈尔吉奥村","哈尔吉奥伯爵","汉娜","阿尔斯托罗","免罪符","乐园","神的慈悲"],"content":"研修第一天三叶在旅馆盘算「解决」塔尔克（心声「一发就结束是不行的」）。次日哈尔吉奥伯爵闯驻地，因儿子阿尔斯托罗（上院议员）谎报村里有绿化教徒，逼迫出兵。莫兰派十名队员与一门大炮前往哈尔吉奥村，本打算敷衍试射讨好伯爵。三叶独自搬运大炮到村外葡萄田附近；塔尔克独自进村，随一声『开火！！』号令，埋伏的绿头巾村民齐射，全小队被歼灭，三叶也中弹「战死」。真相全揭：塔尔克数年前藏匿逃亡教徒汉娜、被教义感化入教，与她结婚生子，把绿之教义传遍全村；食堂教徒负责与总部联络。他处决前同伴，将三叶尸体背到村外墓地埋葬，把她的长枪插坟上作墓碑并献祈祷。他把哈尔吉奥一家关进猪圈，宣告将交教会总部公开处刑。深夜，一名祭酒村民给坟滴酒，三叶从土里爬出——蓝眼已染成空洞的黑色，动作如人偶；她抓住逃跑村民、令其身体从右脚腐烂中毒惨死，说「月亮，真美呢。你有作个好梦吗？」，随后捡起长枪、踩碎其头颅，走向灯火通明的村庄。\n话末状态：三叶（黑瞳、复活）持长枪走向村庄；塔尔克与汉娜在村中欢庆；哈尔吉奥一家囚于猪圈；小队全灭。\n首次登场：哈尔吉奥伯爵、阿尔斯托罗、汉娜、绿之教会祭司体系、免罪符、乐园、神的慈悲（毒品）。\n此时尚未发生：三叶尚未与「三个自己」对话，尚未处刑全村、尚未擒获塔尔克。","constant":false},{"cat":"剧情","title":"卷1·EP12·三叶的刻印","keys":["EPISODE12","三叶的刻印","ミツバの刻印","三个三叶","稳健派","享乐派","激进派","黑瞳","村庄处刑"],"content":"紫雾意识空间中，三叶首次与另外两个「自己」面对面：稳健派（主体）、享乐派、激进派。揭示核心设定——三人「既是三叶又不是三叶」：灵魂被复制的我、被执念束缚的我、不被允许诞生的我，三头制以稳健派为主体。激进派宣告不允许她和平地活、今后会「更努力地醒着」，要在世界刻下痕迹。三叶复活（黑瞳）后，在满月之夜引爆迪甘家、以大炮散弹歼灭灭火人群，掳走塔尔克妻儿汉娜与爱子当人质逼他现身，对上视线时「不是蓝色，而是充满绝望的深远黑色」，一枪击中塔尔克右臂。村广场处刑：逐一审问「你是绿化教徒吗」，承认与否皆刺杀，约五十名村民尽灭，仅留无臭味的婴儿（交给哈尔吉奥「管理」）与作活证人的塔尔克。三叶当面捏碎「神的慈悲」之花、否定天国乐园，揭穿塔尔克吸毒坏脑、对孩子用毒；塔尔克扑上被击昏，三叶杀了他妻儿，令其精神彻底崩溃。翌晨稳健派意识恢复，三叶自述「和平主义意识变得朦胧」，押送塔尔克与哈尔吉奥一家、坚持带走大炮返回里特贝尔；向莫兰报告时隐瞒死而复生，仅称「偶然活下来抢炮反击」，并揭发镇上食堂有联络教徒。莫兰下令搜捕、并向三叶敬礼致谢。\n话末状态：三叶回里特贝尔驻地领谢，请求日后带走那把当过墓碑的长枪；塔尔克入狱（精神崩溃）；哈尔吉奥一家送医（精神失常、称三叶「女神大人」）；莫兰陷入副长叛变的中间管理困境。\n首次登场：三个三叶人格（稳健/享乐/激进）、灵魂复制设定、黑瞳状态、婴儿。\n此时尚未发生：三叶尚未回军官学校受表彰，禁毒立法请求尚未提出，尼科雷纳斯的卷末揭示尚未登场。","constant":false},{"cat":"剧情","title":"卷1·EP13·胜利的美酒","keys":["EPISODE13","胜利的美酒","勝利の美酒","指导室","感谢状","禁毒立法","莉莉亚王国","憎恶的继承","三个要素"],"content":"研修结束回校（临近寒假）。指导室中，帕鲁克校长与加鲁多教官通报表彰：里特贝尔莫兰上尉的感谢状、治安维持局总部的指名表扬信。校长提议让三叶直接毕业，加鲁多以「战争未开、宽容派议员会有意见」反对，改口作罢；长枪暂存军校仓库、毕业后正式收下。宿舍里克萝内已微醺，两人喝「葡萄汁」庆胜利美酒；克萝内自述在东部国境反杀普尔梅尼亚侦察部队、代阵亡指挥官指挥获感谢状。桑德拉从图书馆归来，正经表扬三叶「铲除村中霉菌」的功劳。三叶请桑德拉将来当议员后立法把毒品使用者、贩售者、制造者一律处死，讲解毒品危害（自认前世知识）；桑德拉提供情报：莉莉亚王国（西方强国、多殖民地）疑在殖民地制毒强行出口以从内部腐蚀敌国，并质疑失去理智的绿化教却武装齐全、资金源头存疑（无结论）。卷末转尼科雷纳斯（确证为女性、做过不老处置）视角：付钱给校方事务官获取三叶情报；治安维持局多数人想录用三叶、一部分怀疑她是内奸，尼科雷纳斯将送所长保证书背书。核心揭示——三叶对绿化教的憎恨是「憎恶的继承」；构成三叶的「三个要素」中有一个由尼科雷纳斯创造，她决意守护三叶人生却不告知真相。\n话末状态：三叶回归军校日常、盼寒假却无处可归；克萝内、桑德拉同寝如常；塔尔克待审后将处刑；尼科雷纳斯在研究所收束全卷悬念。\n首次登场：莉莉亚王国、禁毒立法构想、「憎恶的继承」与「三个要素」揭示、尼科雷纳斯不老处置与女性身份确证。\n此时尚未发生：与普尔梅尼亚帝国的正式开战尚未爆发，三叶尚未毕业，第2卷剧情尚未展开。","constant":false},{"cat":"剧情","title":"卷1结局状态","keys":["卷1结局","第一卷结束","卷末状态","全局快照"],"content":"第1卷结束时的全局快照。\n【三叶】陆军军官学校炮兵科学生，入学约一年、临近首个寒假。经里特贝尔实地研修独自摧毁哈尔吉奥村绿化教叛乱，获莫兰上尉感谢状与治安维持局总部指名表扬。已明确自身由「三个人格/要素」构成（稳健派为主体、享乐派、激进派），拥有死而复生（黑瞳状态）、腐蚀致死之力、以气味辨识绿化教徒的能力。对绿化教怀有「憎恶的继承」式的绝对敌意，决意推动禁毒。无处可归、缺乏朋友，日常与克萝内、桑德拉同寝。那把当过墓碑的长枪待毕业后归她。\n【克萝内／库洛涅】炮兵科，东部国境研修中反杀普尔梅尼亚侦察部队、获陆军感谢状；与三叶关系最亲近。\n【桑德拉】炮兵科，志在退役后当市民议员，共和主义者；答应将来推动禁毒立法。\n【塔尔克】里特贝尔驻地副长、绿化教内奸，妻儿被三叶所杀、精神崩溃入狱，待调查后处刑。莫兰上尉因副长叛变陷入责任困境。\n【幕后·尼科雷纳斯】王国魔术研究所所长（女性、经不老处置），三叶「三个要素」之一的创造者与暗中守护者，付钱获取三叶情报，将送保证书为其在治安维持局背书；本人亦深恨绿化教。\n【贵族政局】伊尔洛兹家（当家希尔鲁德）借刀杀三叶失败、『毒蛇』半毁，已与米莉亚娜（布鲁洛兹家代理家主）断交但预期将来再报复；伊尔洛兹家把持拥王派主流、操纵议会。玛丽安娜王妃决定亲自援助三叶。国王鲁洛伊亲市民政策屡遭议会否决、恶评蔓延。\n【大势】王都局势「燃料四处散落」——共和派激进化、绿化教（无政府主义、以毒品与自爆为特征）蔓延、流浪汉与农奴困顿；疑莉莉亚王国在背后散毒腐蚀。数年后预期与普尔梅尼亚帝国开战。此时正式战争尚未爆发。","constant":false},{"cat":"剧情","title":"卷2·EP1·我与我与我","keys":["私と私と私","我与我与我","散兵战术","王魔研公募","人道的处刑器具","加鲁多教官"],"content":"事件链：卷首三叶第一人称独白确立本卷起点——军校在读、日前刚把绿化教徒连同村子一网打尽、心态危险而乐观。图书馆战术课转为自习，克萝内谈罗泽利亚士兵士气低落、战列的真实作用是防止逃兵，讲解让小部队如蛇袭敌的散兵战术理论，并以罕见认真神情预言两三年内必有大战。随后她带来王国魔术研究所（王魔研）向军校发出的公募情报：所长尼科雷纳斯出四题——革新武器、移动手段、携带粮食、人道处刑器具，寒假两周内交企划可加分。三叶被“人道处刑器具”吸引，桑德拉补充市民处刑方式混乱、亟需统一，三叶遂构思断头台并配以由没收麻药制成的止痛药方案。话末状态：三叶暗自决意在寒假独力制作断头台；克萝内、桑德拉与她仍是军校同窗。首次出现：三叶·克劳伯、克萝内、桑德拉、加鲁多教官、王魔研、尼科雷纳斯（名号）、断头台构想、散兵战术、绿化教徒余绪。此时尚未发生：断头台仍只是纸面构想，实物制作与公开处刑均尚未发生。","constant":false},{"cat":"剧情","title":"卷2·EP2·战争游戏","keys":["戦争ごっこ","战争游戏","耐力跑","队列突击","赤红玫瑰永垂不朽","参式长枪"],"content":"事件链：寒假前的期末考。实技测试第一天：十次短跑（克萝内全场第一，三叶第十名前后，桑德拉硬撑）；淘汰制耐力跑约四小时、仅剩两成，脱队者被罚俯卧撑；队列重组与行进——三叶因朋友只有那两人，冲向脱队区强征男生入队、以长枪威胁使其服从（含波特库克），全队唱战意之歌《赤红玫瑰永垂不朽》；队列突击普尔梅尼亚国旗群，装填空弹炮击五发后持刺刀突击，到达顺位克萝内第一、桑德拉第二、三叶班居中，收尾被呕吐的波特库克吐了一脸。第二天学科考试与军法论文。考后闲谈寒假计划：三叶留校造“军官学校七大不可思议”并挑战公募，克萝内四处玩乐，桑德拉回故乡。话末状态：学期结束进入寒假，宿舍只剩三叶一人；克萝内在附近、桑德拉返乡。首次出现：波特库克（葡萄牙蛋糕君）、尼可参式长枪、《赤红玫瑰永垂不朽》、二十期炮兵科同窗群像。此时尚未发生：断头台尚未动工，亡灵兵夜袭校长室的闹剧尚未上演。","constant":false},{"cat":"剧情","title":"卷2·EP3·快乐的冬休","keys":["楽しい冬休み","快乐的冬休","亡灵兵","帕鲁克","塔尔克","断头台第一号"],"content":"事件链：寒假仅三叶留校。她裹床单扮“亡灵兵”夜袭校舍，吓昏警卫与帕鲁克校长，占据校长室为据点，在墙上贴满断头台设计图完成公募企划；受惊病倒的校长“体贴地”提前把企划提交王魔研。尼科雷纳斯（视角）读到断头台大喜，抛开一切一周内造出实物，派部下在校门拦下三叶、接她参观王魔研，途中透露罗泽利亚＋卡萨布兰卡结盟对抗普梅尼亚＋莉莉亚＋库罗卡斯三角同盟的机密，并自陈是受其父吉尔莫亚之托的监护人。中庭以叛国的塔尔克前少尉做断头台第一号实证公开处刑，来宾实务评价良好、推动全国采用。假期末三人酒会得知：三叶将在入学式受表彰、断头台送贝利兹宫殿御览。话末状态：寒假结束前夜，三叶、克萝内、桑德拉共饮；断头台已成公募采用第一号。首次出现：帕鲁克校长、尼科雷纳斯（正式登场）、副所长、塔尔克前少尉、卡萨布兰卡大公国、戴安、莉莉亚、库罗卡斯、吉尔莫亚监护托付。此时尚未发生：入学式表彰与入宫觐见尚未举行，与继母米莉亚娜、两位哥哥的正面遭遇尚未发生。","constant":false},{"cat":"剧情","title":"卷2·EP4·优雅的铁火场","keys":["優雅な鉄火場","优雅的铁火场","贝利兹宫殿","里马斯","艾克","青薔薇之杖","宽容派"],"content":"事件链：军校入学典礼兼表彰仪式，受奖者尽是贵族生（代表里马斯·伊尔洛兹·赛尔彭提），三叶经尼科雷纳斯强烈要求获表彰、当众介绍断头台并挖苦继母米莉亚娜。随后乘马车赴贝利兹宫殿新年宴会：鲁洛伊国王、玛丽安娜王妃逐桌接见，王妃当众抛出重磅传闻——青薔薇之杖继承已完成、三叶才是布鲁洛兹家正统当家，偷听的米莉亚娜憎恶外渗。转场布鲁洛兹家别宅：米莉亚娜与次男米格尔密谋，决定加快催战抢主导权、抹黑宽容派与卡萨布兰卡王妃，并向地下工作者艾克委托暗杀三叶（酬金百万贝尔）；艾克以“三叶暗杀是通往死亡的单程票”当场大笑拒绝。话末状态：三叶入宫受褒、立场被抬高；米莉亚娜暗杀屡败、转向议会催战；艾克拒接委托离去。首次出现：里马斯·伊尔洛兹·赛尔彭提及伊尔洛兹家、鲁洛伊国王、玛丽安娜王妃、马里斯王子、米莉亚娜（正式登场）、米格尔、艾克、宽容派、青薔薇之杖继承之谜、格里埃尔（被提及）。此时尚未发生：战争尚未爆发，格里埃尔尚未在前线出手。","constant":false},{"cat":"剧情","title":"卷2·EP5·战争爆发","keys":["戦争勃発","战争爆发","西德里恩特","多利安特","派翠克","大轮历五八六年"],"content":"事件链：入宫次日教室汇报继承权风波，桑德拉分析上院必借开战抨击宽容派与卡萨布兰卡出身的王妃，断言“战争确定会发生”，路径是向普尔梅尼亚索赔遭拒后开战。约一个月后（大轮历五八六年二月），报纸报道普尔梅尼亚两万军攻入西德里恩特州，战争正式爆发；续报前线被突破、驻扎地司令官战死、普军进攻要冲多利安特市、罗泽利亚决定增兵并依相互防卫条约向卡萨布兰卡请援。克萝内带随从与更新的报纸进教室，引荐骑兵科帅哥派翠克——首个以绅士礼对待三叶者。桑德拉忧心战争税与征兵将使市民不满达极限，带几名同志离席密商。话末状态：战争已爆发、西德里恩特前线告急；三叶等仍在军校但气氛全面转向实战；桑德拉暗中串联共和派同志。首次出现：派翠克、西德里恩特/德里恩特州、多利安特市、斯特拉斯帕尔州（提及）、大轮历五八六年、莱顿/圣莱特/莱夫图尔等男生具名、卡萨布兰卡相互防卫条约。此时尚未发生：三叶尚未被特别选拔、尚未奔赴前线。","constant":false},{"cat":"剧情","title":"卷2·EP6·通往地狱的车票","keys":["地獄への切符","通往地狱的车票","斯特拉斯帕尔","贝里埃要塞","甘泽尔","格里埃尔"],"content":"事件链：开战近三月（四月），训练转为与征兵市民合练实战；报纸分析显示西德里恩特已沦陷、罗泽利亚大劣势（“转进”实为败退）。加鲁德教官宣布特例选拔：十九、二十期步炮兵即刻派遣，二十期炮兵科点名七人——克萝内、莱顿、圣莱特、莱夫图尔、波特库克、汤姆森及三叶（授准尉），桑德拉疑因共和派身份被排除。行军自王都贝尔经两周抵斯特拉斯帕尔驻扎地，编入第十师团、配属贝里埃要塞。要塞指挥所内，甘泽尔中将接管防卫，格里埃尔·布鲁洛兹率五百精锐骑兵抵达，私下请托甘泽尔将三叶与一门旧炮编入必死的诱饵战列使其“光荣战死”，甘泽尔应允。话末状态：三叶已成炮兵准尉、随军抵斯特拉斯帕尔、将赴贝里埃要塞；格里埃尔已设下借刀杀人的死局；桑德拉留校自我约束。首次出现：斯特拉斯帕尔州、贝里埃要塞、甘泽尔中将、罗尔上校、格里埃尔·布鲁洛兹·克劳伯（正式登场）、汤姆森、准尉军阶、普梅尼亚轨道运输与新型大炮传闻。此时尚未发生：贝里埃要塞攻防战尚未打响，三叶尚未真正上阵杀敌。","constant":false},{"cat":"剧情","title":"卷2·EP7·打了又被打被打被打","keys":["贝里埃要塞","特别步兵大队","格里埃尔","约本","法尔肯","戴安要塞攻略炮","甘泽尔"],"content":"三叶（11岁，四月樱花时出征）抵达贝里埃要塞，被甘泽尔中将编入第十师团特别步兵大队，只配一门孤炮和四名怕她甚于怕战争的士兵。迎击会战中特别大队被当作诱饵，大队长战死、我方溃败；三叶独自完成清炮—装药—装弹—点火循环速射，最后被一名黑衣骑兵砍掉右手，记住其脸后「战死」倒地。当夜她在要塞医务室（克萝内称「地狱的休息室」）苏醒，床边倒着中毒身亡、七窍流黑紫血的格里埃尔上校尸体，被克萝内从窗户扔出去。两人搜刮物资撤往西南炮台，与利马大尉、莱顿、圣莱特、莱夫图尔、汤姆森、葡萄牙人会合准备脱逃；三叶向空炮台强注魔力发出两发紫色炮击，炸毁敌戴安要塞攻略炮。普军视角首次登场：约本元帅、法尔肯少校、布鲁特中将、戴安技师长、皇帝鲁道夫。占领后要塞爆发吐紫色泡沫的剧毒疫病（暗示三叶紫魔力为源）。话末：三叶残兵在西南炮台掩护撤退，格里埃尔尸体被弃于要塞外。此时尚未发生：斯特拉斯帕尔讲和条约尚未签订，三叶也尚未就任布鲁洛兹家当家。","constant":false},{"cat":"剧情","title":"卷2·EP8·败北的滋味","keys":["败北的滋味","利马上尉","塞尔贝尔元帅","布鲁洛兹州边境","黑麦面包","罗尔"],"content":"要塞陷落后的败走途中，三叶与克萝内率约两百残兵沿途「征收」民家食物，靠狭窄兽径反复伏击、由三叶狙击敌指挥官（贵族视瞄准指挥官与狙击为卑鄙战术）。防卫队长罗尔上校因强令交食物、赌命阻敌，被士兵连带责任误射身亡。莱顿冒险与罗泽利亚侦察骑兵交换情报，得知增援部队在布鲁洛兹州边境待机。他们成功逃入七家「赌上威信不可被突破」的布鲁洛兹州边境临时阵地。塞尔贝尔元帅（七贵族、勋章满身）犒赏：经利马上尉强烈推荐，破格让克萝内（库洛涅）直接入队授上尉阶级、免回军官学校，编入第七师团；对三叶只以年龄为由给场面话，暗示忌惮其诅咒传闻，并表示将连同败战处置甘泽尔中将、警告帕鲁克校长。话末：克萝内升为上尉、随第十师团转属第七师团，众残兵在边境阵地饮酒庆生还，三叶获一个沾血扁掉的黑麦面包为最大杀敌者奖赏。此时尚未发生：讲和条约细节尚未公开，米莉亚娜的暗杀计划、共和派起义都尚在后头。","constant":false},{"cat":"剧情","title":"卷2·EP9·听得见恶魔之歌","keys":["斯特拉斯帕尔讲和条约","马尔科","希尔鲁德","米格尔","青蔷薇之杖","玛丽安娜","米莉亚娜"],"content":"开战约半年、三叶满12岁，第七师团炮兵队与普军在斯特拉斯帕尔市西侧丘陵对峙。报纸传来讲和消息，塞尔贝尔元帅将机密的《斯特拉斯帕尔讲和条约》抄件给三叶看：罗泽利亚国王鲁洛伊谢罪、负担全部赔偿金（转嫁市民）、割让西德里恩特、拆除贝里埃要塞、设普尔梅尼亚领事馆——形同败北宣言。元帅之子马尔科（上院议员、正道派）说明政局：吉尔莫亚卿死后青之派系被希尔鲁德·伊尔洛兹吸收另立希尔鲁德派，欲借败北打垮宽容派、掌控国政。「好消息」揭晓：格里埃尔战死遗体送回、青蔷薇之杖未继承——葬礼上玛丽安娜王妃揭露现任当家是被米莉亚娜放逐的前夫人之女三叶，王妃已下令恢复其布鲁洛兹荣誉姓氏。话末：三叶尚在前线，即将回王都就任当家；米莉亚娜在王都别墅因爱子之死发狂，被剥夺代理家主之位，暗中筹划勾结绿化教会暗杀三叶、图谋成为国家影之支配者。此时尚未发生：三叶尚未回王都、尚未成为上院议员，桑德拉的革命亦未展开。","constant":false},{"cat":"剧情","title":"卷2·EP10·舞台的邀请","keys":["阿姆尔皮埃塔","三叶派","摩西","爱国税","气愤而死","拉法埃洛","蓝玫瑰之杖"],"content":"大轮历586年11月，三叶回王都贝尔，在贝利兹宫殿举行布鲁洛兹家当主就任仪式，获颜色不吉利呈紫色的蓝玫瑰之杖。步兵科全灭引发退学雪崩，士官学校门可罗雀、正式停课，留到最后的二十名学生（含三叶）直接以军官身份毕业入伍；桑德拉早已退学离去。炮兵科四战友被分配第七师团、葡萄牙人如愿进辎重队，向三叶道别。王妃使者摩西通知：国王推荐议员出缺，12岁的三叶经王妃门路成为上院议员（军人议员）。在阿姆尔皮埃塔议场，蓝、正道、宽容各派皆排斥她，希尔鲁德派大叔当众羞辱，三叶遂在无派系隔离区独自成立「三叶派」。初次演说猛烈反对希尔鲁德派的「爱国税」议案，主张没收主战派财产抵赔偿金，导致十名议员与旁听席二十人当场「气愤而死」（暗示诅咒）。话末：无党无派议员被恐惧魅惑归附三叶派；尼科雷纳斯得知后打算带甜点去打招呼。首次登场：摩西、拉法埃洛（提及）、王魔研副所长、共和派山脉/平原/大地三派。此时尚未发生：三叶派尚未接管军官学校设难民营，桑德拉尚未来访。","constant":false},{"cat":"剧情","title":"卷2·EP11·三叶派与难民大队","keys":["罗塞里亚纸币","难民大队","阿尔斯托罗","萨特鲁","三叶党","断头台","共和俱乐部"],"content":"年末至次年三月。三叶派扩至上院五人、下院十几人，三巨头成形：立宪君主派拉法埃洛（王妃的狗）、崇拜三叶的阿尔斯托罗、鹰派前军务大臣萨特鲁。国家滥发以土地为担保的罗塞里亚纸币付赔偿金，三叶预见暴跌抢购物资，散布囤积商人名单转移市民仇恨，并把停课的军官学校辟为难民收容所，聚起约两千「难民大队」；阿尔斯托罗以三叶徽章组建近乎邪教的「三叶党」，靠踏绘削弱绿化教会。二月桑德拉来访警告三叶已被共和派视为危险人物、赠蜂蜜酒和好；三月桑德拉赶走拉法埃洛，三叶两面树敌，遂煽动桑德拉春天融雪后发动废除议会、公平选举的「革命」，萨特鲁誓死跟随。三叶用仓库军械训练难民自警团，以钉霰弹处刑潜入的绿化教徒。话末：三月中旬绿化教徒率斯兰姆居民约两百人夜袭，三叶收容居民、用断头台处刑三名煽动者，将装入小型榴弹的头颅带往斯兰姆炸毁绿化教会祭司据点，独白盼革命时能「烧得更旺、还要大炮」。首次登场：拉法埃洛、萨特鲁、阿尔斯托罗、共和俱乐部。此时尚未发生：春天的革命起义尚未爆发。","constant":false},{"cat":"剧情","title":"卷2·EP12·HAPPY BIRTHDAY","keys":["HAPPY BIRTHDAY","古鲁特斯","坎帕内罗","国民议会","三大宣言","三叶党旗"],"content":"大轮历五八七年冬～六月六日。冬季鲁洛伊将王妃玛丽安娜、王子马里斯、局长拉法埃洛送往卡萨布兰卡流亡，密令马里斯行继承仪式持赤蔷薇之杖续血脉。米莉亚娜与祭司坎帕内罗交易两头下注：命弟米格尔携王魔研『新型炮弹』逃莉莉亚，拉绿化教徒助王党派趁乱起义以复仇三叶。四月一日流亡见报、民怨爆炸；三叶党（约五百难民、三叶党旗初现）随共和派游行、与代表维克托合流，攻陷阿姆尔皮埃塔宫殿成立国民议会，三叶顺路洗劫布鲁洛兹别墅充资。两月内议会通过农奴解放、国民主权、不当借款无效三大宣言，断头台肃清起；国王处置分山脉派（古鲁特斯，即处死）、平原派（维克托，幽禁）、大地派。六月五日国王通敌卡萨布兰卡丑闻见报压倒反对派。六月六日（三叶十三岁生日）桑德拉持枪押三叶赴议会，投票三二〇比一七八判鲁洛伊死刑。宣判之际三叶发动政变：接党员短枪注紫色魔力射杀正指挥的古鲁特斯及干部三人，难民大队涌入压制议场、散布假消息使敌我不明，维克托、塞贝尔被擒。话末：三叶控场向桑德拉摊牌夺权，遣阿尔斯托罗挟持鲁洛伊去压制贝利兹宫殿，萨特鲁留守待王魔研援军。首次登场：维克托、古鲁特斯、塞贝尔、坎帕内罗、国民议会、三大宣言、断头台、三叶党旗。〖此时尚未发生〗贝利兹宫殿未压制、王冠未戴、王魔研尚未全面协力、桑德拉等未囚地牢。","constant":false},{"cat":"剧情","title":"卷2·EP13·王冠を手に","keys":["王冠を手に","尼科雷纳斯","尼可所长","火焰喷射器","加冕","共和国宣言","戴安"],"content":"大轮历五八七年六月六日政变当日。三叶挟持被塞住嘴的鲁洛伊、率难民大队几乎无阻压制贝利兹宫殿，抵王座之间戴上王冠，自称此日为加冕仪式（阿尔斯托罗欲呼『女王陛下』被制止）。王魔研尼科雷纳斯（尼可）所长踹门率数十武装所员（含被策反的副所长）来贺、全面协力：以新型火焰喷射器焚烧各派根据地，借鲁洛伊之名暂压制各省厅、陆海军本部，软禁欲逃者。政变全貌：古鲁特斯已死、干部送断头台，桑德拉、维克托、塞贝尔被拘，鲁洛伊再关地牢；七贵族与王弟菲利克斯公爵尽逃出王都。三叶盘点班底（阿尔斯托罗、哈尔吉奥伯爵、萨特鲁、尼可所长）叹人才不足，遣使召克萝内；请尼可所长任外交官赴仇敌普力马利亚求终战（顺道见戴安技师长），欲保二十年距离。地牢中三叶给桑德拉两条路——断头台，或扭曲理想协助自己——并内定其为议长；出示古鲁特斯受贿及与维克托暗中交涉的账簿信件作舆论战筹码；预告翌日宫前断头台庆典，宣称罗泽利亚王国将重生为共和国、自任约二十年过渡期国家代表，备选拉法埃洛为议长。话末：三叶据王座握王冠、王都在控，将逐一逼桑德拉、维克托、塞贝尔、鲁洛伊选择去留。首次登场：尼科雷纳斯（尼可所长）协力、火焰喷射器、加冕、共和国宣言、议长内定、戴安技师长（提及）。〖此时尚未发生〗断头台庆典未办、共和国未正式宣布、克萝内未抵达、尼可所长未启程普力马利亚、米格尔带走的注力新型炮弹未爆炸、叛乱与外国干涉未爆发。","constant":false},{"cat":"剧情","title":"卷2结局状态","keys":["卷2结局","罗泽利亚共和国","过渡期国家代表","政变夺权"],"content":"【卷2结局·大轮历五八七年六月六日夜，政变成功当日的全局快照】政权：三叶戴王冠据贝利兹宫殿王座，掌控王都及各省厅、陆海军（皆以鲁洛伊名义压制），自任过渡期国家代表（拟约二十年），罗泽利亚王国将改为共和国（翌日正式宣布）。人物位置：三叶——十三岁，据王座，兼独裁者与『诅咒人偶』；桑德拉、维克托、塞贝尔——囚地牢，待选『协助或断头台』，桑德拉被内定议长；国王鲁洛伊——幽禁地牢，将放出生死两说；玛丽安娜、马里斯（持赤蔷薇之杖）、拉法埃洛——流亡卡萨布兰卡，拉法埃洛或被召回任议长（备选）；三叶班底——阿尔斯托罗（难民大队长）、萨特鲁（前军务大臣）、哈尔吉奥伯爵、尼科雷纳斯所长；克萝内——受召途中未到；米莉亚娜——布鲁洛兹别墅遭洗劫、本人在外两头下注，弟米格尔携注力『新型炮弹』逃莉莉亚；七贵族与王弟菲利克斯公爵——逃出王都；古鲁特斯及山脉派干部——已死。隐患伏笔：叛乱必将爆发、外国（普美利亚·莉莉亚·库洛卡斯三角同盟）将介入、米格尔带走的新型炮弹是定时炸弹、尼可所长将赴普力马利亚求终战。〖此时尚未发生〗断头台庆典、共和国正式宣言、克萝内加入、外国干涉战争、新型炮弹爆炸皆尚未到来。","constant":false},{"cat":"剧情","title":"卷3·EP1·特等席","keys":["特等席","旧布鲁洛兹宅邸","德里恩特会谈","六月六日革命","青霉","掷出的骰子"],"content":"六月六日革命后不久。克萝内在斯特拉斯帕尔第七师团驻地收到三叶邀请，派翠克回报王都混沌、三叶党（被讽称『青霉』）以断头台肃清、开仓放粮争取民心。克萝内说服塞尔贝尔元帅——他舍弃『黑玫瑰』荣誉姓归顺，第七师团约一万五千人归其掌握。两人在时间仿佛停止的旧布鲁洛兹宅邸会谈：三叶坦言只是捡起掉落的王冠、要废王政改共和制、任期限定代表而全权在握，请克萝内给二十年、坐『特等席』，授其大元帅兼第一军司令官等一切空缺要职，握手立约。另线：普尔梅尼亚御前会议上皇帝鲁道夫因惧尼科雷纳斯，命宰相波鲁托斯诱敌至德里恩特『亲手杀之』，玛格努斯的『收割』计划被驳回。德里恩特极密会谈上，鲁道夫见三叶的『脸』当场崩溃、狼狈逃走，被迫缔结二十年互不侵犯条约。话末：克萝内为大元帅将随三叶赴王都；三叶据王都为大总统；鲁道夫误以为三叶是尼科雷纳斯造的兵器。首次登场：克萝内、三叶、派翠克、利马、塞尔贝尔、鲁道夫、波鲁托斯、玛格努斯、尼科雷纳斯，及『特等席』二十年之约、变紫的蔷薇之杖。此时尚未发生：普军尚未毁约入侵，卡利亚攻略尚未开始。","constant":false},{"cat":"剧情","title":"卷3·EP2·罗塞莉亚独裁宣言","keys":["独裁宣言","全权委任法","卡萨布兰卡大使","米莉亚娜","罗德首相","坎特伯里","拉法埃洛"],"content":"三叶在宫殿广场发表演讲宣布共和国诞生、自称与罗泽利亚结婚、向敌对势力宣战——她自知这是『二十年限定的独裁宣言』，首都陷入狂热，不合作报社被以反革命罪送上断头台。萨特鲁协助通过『全权委任法』，使三叶意见凌驾新宪法。军事会议定下一目标：攻王弟菲利克斯据守的卡利亚市，克萝内率第一军团。拉法埃洛升外务大臣。卡利亚方面，希尔鲁德看穿七家自顾不暇无法集结，莉莉安娜因坎特伯里瘟疫（米格尔带去的新型炮弹爆炸）拒援并逮捕米格尔，菲利克斯陷入孤立、希尔鲁德心生异志。卡萨布兰卡大使来抗议玛丽安娜母子被『绑架』，被萨特鲁怒斥赶走。米莉亚娜投靠莉莉安娜首相罗德，以三叶情报与七家门路换米格尔待遇；罗德决定利用她＋绿化教徒并写信挑拨波鲁托斯。话末：桑德拉决意自污、把国家交三叶二十年；波鲁托斯暗定写信唆使玛格努斯『独断』出兵。首次登场：桑德拉、维克托、萨特鲁、阿尔斯托罗、拉法埃洛、罗德首相、米莉亚娜、菲利克斯、希尔鲁德、鲁洛伊，及『全权委任法』『坎特伯里灾难』。此时尚未发生：普军尚未真正入侵，卡利亚尚未陷落。","constant":false},{"cat":"剧情","title":"卷3·EP3·说了谎要吞几根针","keys":["奥赛尔街道","甘泽尔","监视塔","让蔷薇盛开","五八七年十月","普军毁约"],"content":"大轮历五八七年十月。普尔梅尼亚军毁约、从德里恩特进攻约两万人。三叶不派使者抗议，决意亲率难民大队两千、取『大元帅』地位在布鲁洛兹州境的奥赛尔街道迎击；卡利亚攻略照旧由克萝内率第一军团（副将塞尔贝尔）进行；首都交萨特鲁与阿尔斯托罗。会后桑德拉劝阻，三叶吐露真意：无法原谅毁约者弄乱『我的庭院』，并流露人格不稳、思念亡父母、恨米莉亚娜；两人重申二十年后之约、别扭道别。三叶率难民大队进军布鲁洛兹州，与因失态被降为少将的甘泽尔（部下约三千）会合并威压之。抵布鲁洛兹家宅邸后，她登上幼时被囚的监视塔与前国王鲁洛伊对谈：确认玛丽安娜正勾结普军司令、鲁洛伊已无复位意愿，遂给其一家特赦（鲁洛伊拒绝），随后让偷听的玛丽安娜母子现身。话末：三叶宣布窝进监视塔顶层三天，握紧变紫的蔷薇魔杖『让蔷薇盛开』，独自准备以剧毒为核心的战争。首次登场：哈尔吉奥、甘泽尔少将、玛里斯，及『奥赛尔街道』『监视塔』；三叶多重人格首次明确暗示。此时尚未发生：奥赛尔街道会战尚未打响，蔷薇诅咒尚未发动。","constant":false},{"cat":"剧情","title":"卷3·EP4·梦、理想、以及恐怖","keys":["诺斯贝尔","里马斯","杰罗姆","汤姆森","折返吧","生物兵器"],"content":"革命成功已过四个月、普军已毁约来袭之后。克萝内率第一军团三万无抵抗进驻近首都的诺斯贝尔市，市民对三叶陷入宗教般狂热；她推断幕后有桑德拉煽动，并大肆提拔亲信（利马升上校、派翠克升少校）。伊尔洛兹家当家希尔鲁德来信无条件投降恳求饶命，克萝内宽大接受，追加条件：其子里马斯入她麾下当人质。密谈中派翠克进言趁首都空虚（守军仅五千）『现在折返』夺权，克萝内逐条拆解：最关键是『三叶杀不死』——已在士官学校和要塞战『死过两次』，很可能是尼科雷纳斯所造的不死生物兵器，故重申二十年之约、只命派翠克极慎重暗查。另线：桑德拉在议长办公室与保安厅副长官杰罗姆合谋，利用汤姆森偷出的文件＋伪造证据，给内务大臣维克托扣上反革命罪＋叛国罪；她明知伪造仍签名『负起全部责任』，为在三叶二十年独裁后把共和国导回国民主权而自污。话末：克萝内在诺斯贝尔继续向卡利亚推进、希尔鲁德倒戈已成，维克托构陷已备妥待处决。首次登场：里马斯、马尔科（提及）、杰罗姆、汤姆森、艾克，及克萝内『三叶=不死生物兵器』推断。此时尚未发生：卡利亚尚未陷落，奥赛尔会战结果尚未揭晓，维克托尚未正式处决。","constant":false},{"cat":"剧情","title":"卷3·EP5·蔷薇的葬列","keys":["蓝蔷薇之野","针面包","布鲁特","反物质护罩","熟成十年","诅咒不是魔术"],"content":"普尔梅尼亚西部方面军擅自进军：被降职的玛格努斯纠集将领、以第四师团为主两万逼近布鲁洛兹州境，三次抗命、连皇帝恳求折返也不听，途中不断听到女人幻听。奥赛尔街道开满蓝蔷薇如地毯，罗泽利亚仅少数兵布阵、旗前立着白发持紫杖的三叶。开战：约五百诱饵步兵对射后溃退，普军投入能展开反物质护罩的骑兵冲入玫瑰园——浓雾骤起，蓝蔷薇悄然变紫，探查者无一生还。指挥所帐篷内叙述崩坏、记忆错乱，玛格努斯睁眼见白发诅咒人偶：藤蔓缠住布鲁特、开枪命中三叶眉间毫无用处，阿道夫等人吐血融化，玛格努斯右手被击断昏迷。战后三叶换回稳健派，普军两万几乎全灭化作紫玫瑰养分。她只对甘泽尔吐露出身秘密：自己本不该出生，是几百上千人用魔力药物、耗十年『熟成』出的存在，踏进诞生之地者遭诅咒。她端上藏百根针的『针面包』审判玛格努斯，供出情报的布鲁特免针改斩首，玛格努斯被强塞针耙后送断头台，两颗首级留作外交之用。话末：首都传来维克托被处决、杰罗姆接任内务大臣（与EP4闭环）；三叶记挂『还有两个没死的人』——波鲁托斯与鲁道夫。首次登场：布鲁特中将、阿道夫少佐，及『针面包』『十年熟成的诅咒』设定。此时尚未发生：谈和条约尚未缔结，波鲁托斯尚未死。","constant":false},{"cat":"剧情","title":"卷3·EP6·一贝尔也不让","keys":["斯特拉斯帕尔谈和条约","法尔肯","千针夜访","凯旋游行","卡利雅陷落","西德里恩特割让"],"content":"三个『我』在精神世界集会：享乐派因用力过度沉睡不醒，稳健派与激进派照常回去工作。三叶乘胜夺回斯特拉斯帕尔州都（市民却屠尽已投降的普人），决意战后办共和国首次总选举。两天后与普方使者法尔肯谈判，递出自拟的『斯特拉斯帕尔谈和条约』七条：停战、皇帝道歉、再违约则鲁道夫以死谢罪、返还五千万并另付一亿贝尔赔偿金、撤兵并割让东西德里恩特州——『一贝尔也不让』；两万俘虏『全成了玫瑰养分』；赠马格努斯与布鲁特首级。补叙：享乐派睡前已『夜访』——波鲁托斯被刺千针而死（官方粉饰为『意外事故』），鲁道夫被下咒缓刑。五八七年十二月，三叶在首都贝尔凯旋游行，遭绿化教徒开枪暗杀未遂，趁机即兴演说使神格再升级；办公室议题涉绿化教徒地下化、大轮教会旧教/新教两派抗议课税、政教分离立法。另线：克萝内攻陷卡利雅市、枪决顽劣的王弟菲利克斯，七家瓦解、王国血脉断绝，她定下娶里马斯吸收血统、待三叶退位之乱夺权的长期计划。话末：三叶稳坐总统，赔偿金将投军事产业并引征兵制。首次登场：法尔肯少佐、克罗姆秘书官、涅尔凯尔、吉尔伯特/恩斯特，及『斯特拉斯帕尔谈和条约』『千针夜访』。此时尚未发生：向利贝克州东进、对海泽兰德与莉莉安娜的清算尚未展开，米莉亚娜/米格尔仍滞留莉莉亚未处置。","constant":false},{"cat":"剧情","title":"卷3·EP7·朋友","keys":["EPISODE7","朋友","确认能力","强制连任","维克托处决","杰洛姆就任","艾克拜会","阁僚会议","卡利亚市"],"content":"奥瑟利亚街道大胜、凯旋（曾遭绿化教徒自爆袭击未遂）后，约五八七年末。桑德拉在总统办公室确认三叶未受伤，试探其力量能否咒杀敌国指导者；三叶答「我是总统，不是降下神罚的神明」，并道破力量是「恶意加倍返还」、滥用会反噬自身。桑德拉警告：国民依赖已超乎想象，若三叶战死则库洛涅必趁乱夺权、内战地狱化，故强制其连任五届、至大轮历六〇七年止，明言「会最大限度利用你」。政务：平原派议员维克托已被处决，继任内务大臣为「见风使舵」的杰洛姆。杰洛姆携凶相大叔艾克拜会、宣誓效忠，艾克将任国家保安厅副长官；杰洛姆追问真心话，三叶低声答「妨碍这个国家的家伙全都去死」。阁僚会议宣读战报：库洛涅第一军团攻陷卡利亚市，王党派核心菲利克斯侯爵战死，内乱将平。三叶定下苛刻谈和条件借机争取时间、目标百万大军、重组后一年内开战。话末：三叶被强制连任压得呆滞、于宫殿理政；桑德拉主政肃清；杰洛姆、艾克入朝；克萝内率第一军团东进。首次出现：杰洛姆（正式就任）、艾克、波特库克（实习厨师）。此时尚未发生：汉斯公子的联姻危机、八月大选宣言。","constant":false},{"cat":"剧情","title":"卷3·EP8·要遵守公约","keys":["EPISODE8","要遵守公约","汉斯公子","里昂大公","赶回特使","西蒙娜","选举宣言","信任投票","紫雾之地","三个我"],"content":"大轮历五八八年一月，外交方针定后又过约一年。哈尔吉奥已改任秘书官，谈及绿化教徒之子奥莉薇（四岁、健康）由其收养。拉法埃洛报喜：与赫萨兰、卡萨布兰卡停战谈妥；卡萨布兰卡里昂大公（玛丽安娜之父）提条件——确认玛丽安娜平安、接受三子汉斯公子为特使（实为人质兼联姻试探）。克罗姆进言：卡萨布兰卡惯以婚姻政策扩张，欲让汉斯与三叶结婚使血脉进入继承。三叶以「公约」（反对血统继承地位）为由，在记者会宣布已赶回汉斯公子一行，卡萨布兰卡敌对度上升。同场宣布重磅决定：今夏八月举行共和国首次选举（选州长与议员），并承诺选后进行总统信任投票、否决即辞职。记者西蒙娜连番质问变相独裁、要求废除全权委任法，三叶暗中拜托艾克保护她「别意外死亡」。末场「紫雾之地」精神世界：稳健、激进、享乐三个「我」争论，激进派主张与卡萨布兰卡结盟、举国屠灭莉莉亚（因它「散布霉菌」「害我诞生」），稳健派主张长期争夺大陆霸权，约定日后多数表决。话末：三叶主政并对外强硬；克萝内在里贝克州处理海泽兰德、信中透露与里马斯订婚（桑德拉尚不知）。首次出现：汉斯公子、里昂大公、西蒙娜、信任投票制、三重人格设定。此时尚未发生：克萝内与米莉安妮、莉莉安娜首相罗德的勾结。","constant":false},{"cat":"剧情","title":"卷3·EP9·沸腾的野心","keys":["EPISODE9","沸腾的野心","三叶党保守派","米莉安妮","詹姆士·罗德","军团重组","特务师团","甘泽尔","肃清克萝内提案"],"content":"大轮历五八八年三至四月。里贝克州都：克萝内召开选举对策会议，收编旧王党派残党（希尔鲁德、里马斯、马尔科、赛贝尔），决定不建新党而自称「三叶党保守派」争取稳健派与富裕阶层，共同敌人是桑德拉议长。旧州长宅邸密谈：克萝内与米莉安妮（自称米莉安妮·布鲁洛兹·克劳伯）会面，米莉安妮递出莉莉安娜首相詹姆士·罗德的亲笔信（罗德亦欲排除三叶），换取儿子米格尔的安身与「亲手向诅咒人偶复仇」；克萝内收信、暗查旧王魔研与被逐研究员，约定密切联络——反三叶同盟雏形成形。总统办公室：军团重组将各师团编为七军团，甘泽尔被否决军团长、改率三叶直辖五千人「特务师团」为首都快反部队。桑德拉来谈，三叶将绿玫瑰家主雷安德鲁处刑、余者送「义务教育所」洗脑，并反劝桑德拉入党任革新派代表。深夜密谈：杰洛姆报绿化教将伪装参选、库洛卡斯资助普尔梅尼亚叛乱，提议以婚礼为名召回克萝内、以叛乱罪先发肃清——三叶以「有趣」放任，只准继续内查。话末：克萝内在里贝克州积蓄反意；桑德拉决意翌日答复入党；甘泽尔掌特务师团；三叶预感绿化教将动。首次出现：三叶党保守派、特务师团、义务教育所、米莉安妮的复仇计划、詹姆士·罗德。此时尚未发生：桑德拉正式入党、微服视察消毒行动、卷末诸事。","constant":false},{"cat":"剧情","title":"卷3·EP10·宴会永远继续","keys":["EPISODE10","宴会永远继续","微服视察","政治指导委员会","加斯帕·普罗提乌斯","科学技术院","旧下水道","祭司","赞颂歌"],"content":"大轮历五八八年五月。三叶戴兜帽藏白发，由艾克护卫微服视察首都贝尔，真实目的是检查甘泽尔的特务师团是否漏掉绿化教余党。市场气氛开朗、粮食分配完成、治安大好，反革命行为几绝。见识阿尔斯托罗创立的「共和国政治指导委员会」向民众宣讲选举与反绿化教（伪装支持三叶、鼓吹减军费废税者即霉菌，一经发现即杀）。三叶在小巷撞见伪装候选人的绿化教徒散布毒品，脱兜帽亮身份「蓝色恶魔」，施加诅咒拷问逼供，顺藤摸瓜端掉潜伏「旧下水道」（已从地图抹去）的基地，除祭司外尽数焚毁，困苦民众交难民大队救助。回宫见阿尔斯托罗率众为六月六日革命纪念日兼三叶生日排练美化她的赞颂歌，三叶严禁向民间推广。首次出现：加斯帕·普罗提乌斯（科学家兼前征税官，被杰洛姆救下，任新设科学技术院院长）、共和国政治指导委员会、旧下水道基地、艾克本为杀手头目的来历。话末：三叶完成首都「消毒」将向全国推展；艾克掌保安实务；阿尔斯托罗兼四职加议员、忠诚百分百；六月六日十四岁生日将至。此时尚未发生：授勋仪式、阅兵、与尼可及桑德拉的生日谈话。","constant":false},{"cat":"剧情","title":"卷3·EP11·十四岁的生日","keys":["EPISODE11","十四岁的生日","授勋仪式","阅兵游行","尼可同车","别以为你能得到安乐的结局","钢笔","佩拉尔戈·摩里斯","拉法埃洛私通"],"content":"大轮历五八八年六月六日，三叶十四岁生日兼革命纪念日。晨间与桑德拉敲定盛大阅兵向各国大使展示内乱平息；莉莉安娜、卡萨布兰卡、库洛卡斯未派贺使；对卡萨布兰卡定案——九月一日选举后公开雷恩大公谴责信、煽动蒙佩利亚州民起事夺回失地再进军其本土。与赫萨兰谈和谈妥（道歉＋一亿贝尔）。桑德拉赠刻玫瑰的钢笔，坦白原打算克萝内一来就抓捕处刑、计划落空；克萝内派派翠克少校代理，寄来祝福信与便宜葡萄酒、约定隔空对星举杯。王座大厅授勋：阿尔斯托罗、桑德拉等受六月革命蔷薇勋章与三叶草勋章。与尼可所长同车游行时，三叶点破「一切元凶就是身旁笑着的这个人」，尼可自白曾含枪自尽未遂、疑似求死；三叶握住她双手，以诅咒般复数嗓音宣告『别以为你能得到如此安乐的结局』——不杀，但让她见证一切到最后。深夜与桑德拉共饮：定案拉法埃洛因谈和失败辞职、由前教会怪人佩拉尔戈·摩里斯接任外务大臣；杰洛姆暗报拉法埃洛私通隐居的玛丽安娜（鲁洛伊家），被三叶压下并严警各方。首次出现：佩拉尔戈·摩里斯、奥莉薇献花、六月革命蔷薇勋章、尼可自杀未遂、拉法埃洛私通丑闻。现有三卷到此为止，之后的剧情原作尚未描写。已埋下的伏笔：克萝内已与米莉安妮及首相罗德勾结、第一军团拒撤驻里贝克州（卷末「挚友克萝内也会造反吗」）；九月一日选举、对卡萨布兰卡开战、莉莉亚趁机出手；尼可燃料将尽而遭三叶诅咒宣告；拉法埃洛私通玛丽安娜之雷；三叶对尼可「一切元凶」的憎恶「会不会盛大爆发，敬请期待」；末句「不是对我们，而是对我」暗示复数人格与主体之关系。","constant":false},{"cat":"剧情","title":"卷3结局状态·全书现状","keys":["卷3结局","全书现状","现有三卷","现状快照","五八八年","选举前","未回收伏笔"],"content":"现有三卷终于大轮历五八八年六月六日（三叶十四岁生日），距九月一日首次议会选举尚有约三月。政局：普尔梅尼亚战胜后首都粮食分配完成、民心大定，三叶个人崇拜自然发酵（御用报社、赞颂歌、阿尔斯托罗的政治指导委员会），三叶党将在选举中翼赞式压胜；桑德拉借「有嫌疑就处罚」的大肃清恢复治安却背负「断头台议长」恶名，经三叶与杰洛姆合谋入党任革新派代表；克萝内收编旧王党派与富裕阶层自称「三叶党保守派」，将成在野党。人物下落：三叶居贝利兹宫殿独裁理政；杰洛姆任内务大臣、艾克掌保安实务（原杀手头目）；克萝内率第一军团拒撤、驻里贝克州并索增兵追加预算，暗中已与米莉安妮（誓为子复仇）、莉莉安娜首相詹姆士·罗德勾结成反三叶同盟雏形，与里马斯政治订婚；拉法埃洛因谈和失败将于选举后辞外务大臣、由前教会怪人佩拉尔戈·摩里斯接任，其私通隐居布鲁洛兹州的玛丽安娜（鲁洛伊家）丑闻被三叶压下、全员受监视；尼可所长自杀未遂、疯狂与复仇「燃料」将尽，被三叶宣告『别以为你能得到安乐的结局』。对外：赫萨兰谈和成立（赔偿一亿贝尔）、东北战事结束；与阿尔卡迪亚合众国缔松散军事同盟牵制莉莉亚、回赠巨型纪念碑；卡萨布兰卡交涉僵局（雷恩大公愿撤蒙佩利亚州却拒赔），三叶定于选举后煽动开战；莉莉安娜安静得可疑、海军差距使侵攻不可行，库洛卡斯在普尔梅尼亚捣乱，绿化教残党首都基本肃清（弃教者约半数受毒品后遗症折磨，将建治疗设施）。未回收伏笔：克萝内造反、九月大选与信任投票、对卡萨布兰卡之战及莉莉亚介入、米莉安妮与尼可的复仇线、拉法埃洛私通之雷、尼可的「新型」武器，及末句「不是对我们，而是对我」所暗示的复数人格与「我」之归属。原作至此为止，之后剧情尚未描写。","constant":false},{"cat":"核心","title":"剧场界面·档案格式","keys":["StatusBlock","档案格式","界面"],"content":"【输出格式·铁则】每轮回复固定结构：先写正文（正文内严禁```围栏、Markdown标题、表格，严禁出现字样StatusBlock），正文结束后另起一行，输出且仅输出一个<StatusBlock>…</StatusBlock>，内为一段合法JSON（全部双引号、无注释、无尾逗号；字符串内部引用一律用『』不用\"）。缺失或残缺该块即为格式错误。模板如下（□处按当前剧情填写）：\n<StatusBlock>\n{\"时间\":{\"卷\":\"第□卷·EP□\",\"日期\":\"大轮历□□□年·□\",\"时刻\":\"清晨/午前/午后/黄昏/深夜等\",\"天气\":\"□\",\"地点\":\"州/城·具体场所\"},\"主角\":{\"名\":\"□\",\"身份\":\"□\",\"状态\":\"一句话身体与处境\",\"服装\":\"□\",\"持有\":[\"□\"],\"心声\":\"一句话内心独白（贴合该角色口吻）\",\"无聊\":0-100,\"诅咒\":0-100,\"人格\":{\"稳健\":□,\"享乐\":□,\"激进\":□}},\"声望\":{\"阶层或派系\":-100~100（2~5项）},\"在场\":[{\"名\":\"□\",\"身份\":\"□\",\"状态\":\"一句话\",\"好感\":0-100,\"畏惧\":0-100,\"心声\":\"一句话真实想法，可与表面言行相反\"}],\"编年史\":[{\"时\":\"□\",\"事\":\"□\",\"态\":\"已/今/将\"}],\"列国\":[{\"国\":\"□\",\"况\":\"一句话\"}],\"要闻\":[\"报纸风标题\"],\"抉择\":[\"第二人称行动短句\"]}\n</StatusBlock>\n【填写规则】①主角=当前{{user}}扮演的角色；好感/畏惧=各NPC对该角色的态度。②所有数值从上一轮继承并小幅渐变（通常±1~15），仅重大事件可大变；禁止无理由跳变。③\"无聊\"\"诅咒\"\"人格\"三字段仅在主角为三叶时填写（人格三项合计100，对应稳健/享乐/激进三个我的当前话语权），扮演他人时省略这三项。④\"在场\"只列当前场景实际在场者，至多6项，随人物进出场增删；三叶不是主角时应列入在场。⑤\"编年史\"4~7条：\"已\"=已发生史实，\"今\"=本场，\"将\"=只写暧昧的预兆、流言或不祥之感，严禁写出未发生事件的具体内容与人名（防未卜先知）。⑥\"要闻\"1~3条，用该世界报纸或小道消息口吻，冷面幽默。⑦\"抉择\"2~3条，供{{user}}下一步选择的行动短句，贴合当前角色性情，允许最后一条荒唐。⑧\"列国\"2~5条，只写当前时点各国公开可知的状态。","constant":true}]}</script>
<script>
(function(){

}
function worldParas(text,upto){var t=(upto==null)?text:text.slice(0,upto);return t.split(/\n+/).filter(Boolean).map(function(p){return '<p style="margin:0 0 14px;font-size:16px;line-height:2.05;color:var(--ink);text-align:justify;text-wrap:pretty">'+dlgSpan(esc(p))+'</p>';}).join('');}

}

var LOWFX=false;try{LOWFX=localStorage.getItem('mitsuba_lowfx')==='1';}catch(e){}
if(LOWFX)document.documentElement.classList.add('zjLow');

  var cv=document.getElementById('zjGL'); if(!cv)return;
  try{

    rnd.setPixelRatio(LOWFX?1:Math.min(2,window.devicePixelRatio||1));
    rnd.setSize(window.innerWidth,window.innerHeight);
    GL.applyLow=function(on){try{rnd.setPixelRatio(on?1:Math.min(2,window.devicePixelRatio||1));rnd.setSize(window.innerWidth,window.innerHeight);}catch(e){}};
    var scene=new T.Scene();

    cam.position.set(0,0,3.1);
    scene.add(new T.AmbientLight(0xf8f2e4,1.05));
    var sun=new T.DirectionalLight(0xfff4e0,.6); sun.position.set(-2.2,2.6,3.2); scene.add(sun);
    var fill=new T.DirectionalLight(0xdce4f2,.42); fill.position.set(2.4,-1.4,2.0); scene.add(fill);
    /* 做旧三色布料贴图：平滑污渍与织纹，画布绘制，无块状噪点 */
    var tex=(function(){
      var c=document.createElement('canvas');c.width=1024;c.height=640;var x=c.getContext('2d');
      x.fillStyle='#5B76AC';x.fillRect(0,0,378,640);
      x.fillStyle='#F6F0E2';x.fillRect(378,0,268,640);
      x.fillStyle='#BE5A50';x.fillRect(646,0,378,640);
      var i,g;
      for(i=0;i<16;i++){var sx=Math.random()*1024,sy=Math.random()*640,sr=70+Math.random()*200;
        g=x.createRadialGradient(sx,sy,0,sx,sy,sr);
        var dark=Math.random()<.55;
        g.addColorStop(0,dark?'rgba(70,60,44,'+(0.03+Math.random()*0.045)+')':'rgba(255,250,236,'+(0.05+Math.random()*0.07)+')');
        g.addColorStop(1,'rgba(0,0,0,0)');
        x.fillStyle=g;x.fillRect(0,0,1024,640);}
      x.globalAlpha=.032;x.strokeStyle='#3a2f24';

function parseMvu(text){
  var m = /<mvu_panel>([\s\S]*?)<\/mvu_panel>/.exec(text||'');
  if(!m) return null;
  var block = m[1];
  function sec(n){var s=new RegExp('<sec_'+n+'>([\\s\\S]*?)</sec_'+n+'>').exec(block);return s?s[1]:'';}
  function lines(src,mk){return src.split('\n').map(function(l){return l.trim();}).filter(function(l){return l.indexOf(mk)===0;}).map(function(l){return l.slice(1).split('|').map(function(p){return p.trim();});});}
  var char={},world={};
  lines(sec('char'),'◆').forEach(function(a){char[a[0]]=a.slice(1).join('|');});
  lines(sec('world'),'◇').forEach(function(a){world[a[0]]=a.slice(1).join('|');});
  var npcs = lines(sec('npc'),'◈').map(function(p){return {name:p[0]||'',state:p[1]||'',favor:parseInt(p[2],10)||0,thought:p[3]||''};});
  return {char:char,npcs:npcs,world:world};
}
function stripMvu(t){return String(t||'').replace(/<mvu_panel>[\s\S]*?<\/mvu_panel>/g,'').replace(/<UpdateVariable>[\s\S]*?<\/UpdateVariable>/g,'').trim();}
function parseDeed(text){
  var m=/<sec_deed>([\s\S]*?)<\/sec_deed>/.exec(text||'');
  if(!m)return null;
  var out={build:[],raze:[],come:[],go:[]};
  var map={'兴作':'build','毁损':'raze','来者':'come','去者':'go'};
  m[1].split('\n').forEach(function(l){
    l=l.trim();if(l.charAt(0)!=='▣')return;
    var pp=l.slice(1).split('|');var k=map[(pp[0]||'').trim()];if(!k||!pp[1])return;
    pp[1].split(/[、,，;；]/).forEach(function(it){
      it=it.trim();if(!it||it==='无')return;
      var mm=/^(.+?)[×xX*]\s*(\d+)$/.exec(it);
      out[k].push({name:mm?mm[1].trim():it,n:mm?Math.min(5,parseInt(mm[2],10)||1):1});
    });
  });
  return (out.build.length||out.raze.length||out.come.length||out.go.length)?out:null;
}
function deedHash(t){var h=5381;t=String(t||'');for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return h.toString(36);}
function edictSync(){
  if(S.screen!=='game'||!window.ZJ3D||!ZJ3D.owns()||!ZJ3D.applyEdict)return;
  for(var i=S.history.length-1;i>=0;i--){
    var h=S.history[i];if(h.role!=='world')continue;
    var d=parseDeed(h.text);
    if(d)ZJ3D.applyEdict(d,'t'+i+'@'+deedHash(h.text));
    return;
  }
}
function panelToText(p){
  if(!p) return '';
  var c = Object.keys(p.char).map(function(k){return '◆'+k+'|'+p.char[k];}).join('\n');
  var n = p.npcs.map(function(x){return '◈'+[x.name,x.state,x.favor,x.thought].join('|');}).join('\n');
  var w = Object.keys(p.world).map(function(k){return '◇'+k+'|'+p.world[k];}).join('\n');
  return '<mvu_panel>\n<sec_char>\n'+c+'\n</sec_char>\n<sec_npc>\n'+n+'\n</sec_npc>\n<sec_world>\n'+w+'\n</sec_world>\n</mvu_panel>';
}
function scanLore(recent,budget,history,userInput){
  budget = budget||9000; var out=[],used=0;
  var op=currentOpening(); var now=(op&&typeof op.year==='number')?op.year:null;
  /* 按开局朝代供电：未来条目硬关断（防剧透防穿越）；当前时代条目优先装桶；
     已成过去的条目降级为「过往记忆」，仅在被提及时排在末位注入。
     兼容 ST 高级字段：次级关键词(须同时命中)、注入顺序、触发概率、扫描深度、递归扫描 */
  function future(e){return now!==null&&typeof e.from==='number'&&e.from>now;}
  function past(e){return now!==null&&typeof e.to==='number'&&e.to<now;}
  function push(e){if(out.indexOf(e)>=0)return;if(used+e.content.length<=budget){out.push(e);used+=e.content.length;}}
  function textAt(e){
    if(!e.depth||!history)return recent;
    return history.slice(-e.depth).map(function(h){return h.text;}).join('\n')+'\n'+(userInput||'');
  }
  function hitBy(e,txt){
    if(!(e.keys||[]).some(function(k){return k&&txt.indexOf(k)>=0;}))return false;
    if(e.keys2&&e.keys2.length&&!e.keys2.some(function(k){return k&&txt.indexOf(k)>=0;}))return false;
    return true;
  }
  function pass(e){return e.prob==null||Math.random()*100<e.prob;}
  var UL=ULORE.filter(function(e){return e.on!==false&&e.content;});
  var L=(G.lorebook||[]).concat(UL).filter(function(e){return !future(e);});
  L.forEach(function(e){if(e.constant&&pass(e)) push(e);});
  L.forEach(function(e){ /* 各朝【指南】：命中当前年代即常驻，不靠关键词 */
    if(!e.constant&&e.pin&&now!==null&&typeof e.from==='number'&&e.from<=now&&(typeof e.to!=='number'||now<=e.to)) push(e);
  });

function parsePreset(txt,fname){
  var name=fname||'自定义预设';
  var obj=null; try{obj=JSON.parse(txt);}catch(e){}
  var entries=[];
  var MARKERS=['chatHistory','dialogueExamples','charDescription','charPersonality','scenario','personaDescription','worldInfoBefore','worldInfoAfter'];
  if(obj&&Array.isArray(obj.prompts)){
    if(obj.name)name=String(obj.name);
    var map={}; obj.prompts.forEach(function(p){if(p&&p.identifier)map[p.identifier]=p;});
    var order=null;
    if(Array.isArray(obj.prompt_order)&&obj.prompt_order.length){
      var best=obj.prompt_order[0];
      obj.prompt_order.forEach(function(o){if((o.order||[]).length>(best.order||[]).length)best=o;});
      order=best.order||[];
    }
    var seq=order?order:obj.prompts.map(function(p){return {identifier:p.identifier,enabled:p.enabled!==false};});
    var seen={},phase='pre';
    seq.forEach(function(o){
      var p=map[o.identifier]; if(!p||seen[o.identifier])return; seen[o.identifier]=1;
      if(p.marker||MARKERS.indexOf(p.identifier)>=0){ if(p.identifier==='chatHistory')phase='post'; return; }
      var c=String(p.content||'').trim(); if(!c)return;
      entries.push({name:String(p.name||p.identifier),content:c,pos:phase,on:o.enabled!==false&&p.enabled!==false});
    });
  }else if(obj&&(obj.content||obj.system_prompt||obj.sysprompt)){
    var c2=obj.content||obj.system_prompt||obj.sysprompt; if(typeof c2==='object')c2=c2.content||'';
    if(obj.name)name=String(obj.name);
    if(c2)entries.push({name:'系统提示词',content:String(c2).trim(),pos:'pre',on:true});
  }else if(String(txt||'').trim()){
    entries.push({name:'自定义提示词',content:String(txt).trim(),pos:'pre',on:true});
  }
  return entries.length?{name:name,on:true,entries:entries}:null;
}

function buildMessages(history,userInput){
  var msgs=[];
  /* 长上下文瘦身：原文只带最近30条，更早剧情已由编年长卷以编年纪要形式注入系统提示 */
  if(history.length>30)history=history.slice(-30);
  history.forEach(function(h,i){
    var lastWorld = h.role==='world' && i===history.length-1;
    var mc=h.text;
    if(h.role==='world'){mc=lastWorld?mc:stripMvu(mc);mc=stripCoT(mc);mc=applyRegex(mc,'prompt');}
    msgs.push({role:h.role==='user'?'user':'assistant',content:mc});
  });
  msgs.push({role:'user',content:userInput});
  var merged=[];
  msgs.forEach(function(m){var last=merged[merged.length-1];if(last&&last.role===m.role)last.content+='\n\n'+m.content;else merged.push({role:m.role,content:m.content});});
  if(merged[0]&&merged[0].role==='assistant')merged.unshift({role:'user',content:'（开始）'});
  return merged;
}

/* ---------------- 长程记忆 · 编年长卷 ----------------
   每轮世界回应自动摘为一条编年纪要（纪年·时地·玩家之举·记录），永久保存、
   每轮全量注入系统提示——正文历史再怎么被截断，既定事实也不会丢。 */
function memFp(t){var h=5381,str=String(t||'').slice(0,120);for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return h;}
function worldOrdinal(i){var c=-1;for(var k=0;k<=i&&k<S.history.length;k++)if(S.history[k].role==='world')c++;return c;}
function memWorldIdx(j){var c=-1;for(var i=0;i<S.mem.length;i++){if(!S.mem[i].manual){c++;if(c===j)return i;}}return -1;}
function memEntryOf(worldMsg,actText){
  var p=worldMsg.panel||parseMvu(worldMsg.text);
  var line=(p&&p.char&&p.char['记录'])||'';
  if(!line)line=applyRegex(stripCoT(stripMvu(worldMsg.text)),'prompt').replace(/\s+/g,' ').slice(0,70);
  return {e:p&&p.world?(p.world['纪年']||''):'',d:p&&p.world?(p.world['时地']||''):'',
    a:String(actText||'').replace(/\s+/g,' ').slice(0,40),s:String(line).replace(/\s+/g,' ').slice(0,90),fp:memFp(worldMsg.text)};
}
function memSync(){
  if(!S.mem)S.mem=[];
  var worlds=[],acts=[];
  for(var i=0;i<S.history.length;i++){
    var h=S.history[i];
    if(h.role==='world'){worlds.push(h);acts.push(i>0&&S.history[i-1].role==='user'?S.history[i-1].text:'');}
  }
  var n=S.memN||0;
  if(worlds.length<n){S.memN=worlds.length;return;} // 历史被重开/回退
  var changed=false;
  // 重演此幕：条数未增但末条内容换了 → 更新末条
  if(worlds.length===n&&n>0&&S.mem.length&&S.mem[S.mem.length-1].fp!==memFp(worlds[n-1].text)&&!S.mem[S.mem.length-1].manual){
    S.mem[S.mem.length-1]=memEntryOf(worlds[n-1],acts[n-1]);changed=true;
  }
  for(var j=n;j<worlds.length;j++){S.mem.push(memEntryOf(worlds[j],acts[j]));changed=true;}
  if(worlds.length!==n){S.memN=worlds.length;changed=true;}
  if(changed)savePref();
}
function memChronicle(){
  var lines=S.mem.map(function(m,i){
    var head=(m.e||'')+(m.d?('·'+m.d):'');
    return (i+1)+'. '+(head?('『'+head+'』'):'')+(m.a?('玩家'+(m.manual?'手记':'之举')+'：'+m.a+'。'):'')+(m.s?('档案载：'+m.s):'');
  });
  var total=lines.join('\n');
  if(total.length<=7000)return total;
  var head=lines.slice(0,8),tail=[],used=head.join('\n').length+20;
  for(var i=lines.length-1;i>=8;i--){if(used+lines[i].length>7000)break;tail.unshift(lines[i]);used+=lines[i].length+1;}
  return head.join('\n')+'\n……（中略 '+(lines.length-8-tail.length)+' 条，已录于长卷）……\n'+tail.join('\n');
}

    var plain=function(){callCustomAI(sys,msgs).then(function(t){if(!t||!String(t).trim())throw new Error('接口返回了空回复（可能被内容过滤或模型名不对）');done(t,true);}).catch(fail);};
    if(API.gen&&API.gen.stream!=='0'&&window.ReadableStream){
      var live={role:'world',text:'',panel:null};var started=false,lastR=0;
      callCustomAIStream(sys,msgs,function(full){
        live.text=full;
        if(!started){started=true;S._stream=true;S.thinking=false;S.aiLive=true;S.history=base.concat([{role:'user',text:text},live]);render();lastR=Date.now();}
        else{jpIsleTick();if(Date.now()-lastR>650){lastR=Date.now();renderSoft();}}
      }).then(function(t){
        S._stream=false;
        if(!t||!String(t).trim())throw new Error('接口返回了空回复');
        live.text=t;live.panel=parseMvu(t);S.thinking=false;S.aiLive=true;
        if(S._swipeFrom){live.alts=S._swipeFrom.concat([t]).slice(-8);live.altIx=live.alts.length-1;S._swipeFrom=null;}
        if(!started)S.history=base.concat([{role:'user',text:text},live]);
        render();savePref();genSuggestions();
      }).catch(function(){
        S._stream=false;

        if(started){var lx=S.history.indexOf(live);if(lx>=0)S.history.splice(lx,1);}
        S.thinking=true;render();
        plain();
      });
      return;
    }
    plain();
  }else if(claudeOK){
    var body={model:'claude-sonnet-4-5',max_tokens:4000,system:buildSystem(base,text),messages:buildMessages(base,text)};
    Promise.resolve(window.claude.complete(body)).then(function(t){done(t,true);}).catch(function(){done(demoReply(base.concat([{role:'user',text:text}]),text),false);});
  }else{

}
function reroll(){
  var h=S.history;
  if(S.thinking||h.length<2)return;
  if(h[h.length-1].role!=='world')return;
  if(TH.available){
    if(TH.triggerSlash){S.thinking=true;render();try{TH.triggerSlash('/swipe');}catch(e){}setTimeout(pullHistory,1500);}
    return;
  }
  // local: need preceding user
  if(h.length<3||h[h.length-2].role!=='user')return;
  var user=h[h.length-2];var base=h.slice(0,h.length-2);
  var oldW=h[h.length-1];
  S._swipeFrom=(oldW.alts&&oldW.alts.length?oldW.alts.slice():[oldW.text]).slice(-7);
  S.thinking=true;S.history=h.slice(0,-1);render();
  advanceLocal(base,user.text);
}

function parseShareCode(txt){
  var clean=String(txt||'').replace(/\s+/g,'');
  var m=/op=([A-Za-z0-9+\/=]{40,})/.exec(clean)||/([A-Za-z0-9+\/=]{40,})/.exec(clean);
  if(!m)return null;
  try{
    var o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if(!o||!o.op||!o.op.text)return null;
    return o;
  }catch(e){return null;}
}

/* ---------------- OVERLAYS ---------------- */
function renderOverlay(){
  var box=document.getElementById('zjOvBox');
  if(!box||!S.overlay){render();return;}
  var tmp=document.createElement('div');
  tmp.innerHTML=overlayView();
  var fresh=tmp.querySelector('#zjOvBox');
  if(fresh){
    /* 重建前记住各滚动容器位置，重建后按「标签+类名+同类序号」原位恢复——
       不能按元素序号对位：胶囊等动态节点会让新旧DOM序号错位，导致画面弹回顶部 */
    function ovk(el){return el.tagName+'|'+(el.getAttribute('class')||'');}
    var sv=[],cnt={},all=box.getElementsByTagName('*'),i,k;
    for(i=0;i<all.length;i++){k=ovk(all[i]);cnt[k]=(cnt[k]||0)+1;
      if(all[i].scrollTop||all[i].scrollLeft)sv.push([k,cnt[k]-1,all[i].scrollTop,all[i].scrollLeft]);}
    box.innerHTML=fresh.innerHTML;
    var all2=box.getElementsByTagName('*'),cnt2={};
    for(i=0;i<all2.length;i++){k=ovk(all2[i]);var n2=(cnt2[k]=(cnt2[k]||0)+1)-1;
      for(var j=0;j<sv.length;j++){if(sv[j][0]===k&&sv[j][1]===n2){all2[i].scrollTop=sv[j][2];all2[i].scrollLeft=sv[j][3];}}}
    codexPills();setPills();
  }else render();
}

var GPH={drag:null,raf:0,squelch:false};
function graphHydrate(){
  var svg=document.getElementById('zjGraphSvg');
  if(!svg||svg.__gph)return;
  svg.__gph=1;
  var nodes=[];
  [].forEach.call(svg.querySelectorAll('g[data-npc]'),function(g){
    var c=g.querySelector('circle');if(!c)return;
    var nm=g.getAttribute('data-npc'),ln=null;
    [].forEach.call(svg.querySelectorAll('line[data-ln]'),function(l){if(l.getAttribute('data-ln')===nm)ln=l;});
    var x=parseFloat(c.getAttribute('cx')),y=parseFloat(c.getAttribute('cy'));
    nodes.push({g:g,c:c,ts:g.querySelectorAll('text'),ln:ln,x0:x,y0:y,x:x,y:y,vx:0,vy:0,ox:0,oy:0});
  });
  var allLn=[].slice.call(svg.querySelectorAll('line[data-ln]'));
  var cg=svg.querySelector('g[data-gcenter]');
  if(cg){var cc0=cg.querySelector('circle');
    if(cc0){var cxx=parseFloat(cc0.getAttribute('cx')),cyy=parseFloat(cc0.getAttribute('cy'));
      nodes.push({g:cg,c:cc0,ts:cg.querySelectorAll('text'),ln:null,lns:allLn,isC:true,x0:cxx,y0:cyy,x:cxx,y:cyy,vx:0,vy:0,ox:0,oy:0});}}
  if(!nodes.length)return;
  function apply(n){
    n.c.setAttribute('cx',n.x);n.c.setAttribute('cy',n.y);
    if(n.isC){
      if(n.ts[0]){n.ts[0].setAttribute('x',n.x);n.ts[0].setAttribute('y',n.y+5);}
      if(n.lns)n.lns.forEach(function(l){l.setAttribute('x1',n.x);l.setAttribute('y1',n.y);});
      return;
    }
    if(n.ts[0]){n.ts[0].setAttribute('x',n.x);n.ts[0].setAttribute('y',n.y-2);}
    if(n.ts[1]){n.ts[1].setAttribute('x',n.x);n.ts[1].setAttribute('y',n.y+11);}
    if(n.ln){n.ln.setAttribute('x2',n.x);n.ln.setAttribute('y2',n.y);}
  }
  function step(){
    var act=false;
    nodes.forEach(function(n){
      if(GPH.drag===n){act=true;return;}
      var tx=n.x0+n.ox,ty=n.y0+n.oy;
      n.vx=(n.vx+(tx-n.x)*.14)*.8;n.vy=(n.vy+(ty-n.y)*.14)*.8;
      n.x+=n.vx;n.y+=n.vy;
      if(Math.abs(n.vx)+Math.abs(n.vy)+Math.abs(tx-n.x)+Math.abs(ty-n.y)>.15)act=true;
      apply(n);
    });
    GPH.raf=act?requestAnimationFrame(step):0;
  }
  function kick(){if(!GPH.raf)GPH.raf=requestAnimationFrame(step);}
  function pt(e){var q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;var m=svg.getScreenCTM();return m?q.matrixTransform(m.inverse()):{x:0,y:0};}
  svg.addEventListener('pointerdown',function(e){
    var g=e.target&&e.target.closest?e.target.closest('g[data-npc],g[data-gcenter]'):null;
    if(!g)return;
    var n=null;nodes.forEach(function(x){if(x.g===g)n=x;});
    if(!n)return;
    GPH.drag=n;n._moved=0;n._sx=e.clientX;n._sy=e.clientY;
    try{svg.setPointerCapture(e.pointerId);}catch(ex){}
    e.preventDefault();kick();
  });
  svg.addEventListener('pointermove',function(e){
    var n=GPH.drag;if(!n)return;
    var q=pt(e);
    n._moved=Math.max(n._moved||0,Math.abs(e.clientX-n._sx)+Math.abs(e.clientY-n._sy));
    n.x=q.x;n.y=q.y;apply(n);
    var dx=n.x-n.x0,dy=n.y-n.y0;
    nodes.forEach(function(o){
      if(o===n)return;
      var dd=Math.hypot(o.x0-n.x0,o.y0-n.y0)||1;
      var w=Math.min(.42,21/dd);
      o.ox=dx*w;o.oy=dy*w;
    });
    kick();
  });
  function gup(){
    var n=GPH.drag;if(!n)return;
    GPH.drag=null;
    if((n._moved||0)>7){GPH.squelch=true;setTimeout(function(){GPH.squelch=false;},350);}
    nodes.forEach(function(o){o.ox=0;o.oy=0;});
    kick();
  }
  svg.addEventListener('pointerup',gup);
  svg.addEventListener('pointercancel',gup);
}

function animOnce(el,key){

function pillFlip(pillId,oldRect){

var MORPH_E='cubic-bezier(.3,1.08,.32,1)',MORPH_D=400,morphBusy=false;
function morphSrc(sel,box){var els=document.querySelectorAll(sel);for(var i=0;i<els.length;i++){if(els[i]!==box&&(!box||!box.contains(els[i]))&&els[i].offsetParent)return els[i];}return null;}
function morphFlip(box,src){ /* 以 transform 表达源矩形（GPU合成，3D再忙不掉帧） */
  var fin=box.getBoundingClientRect(),fr=src.getBoundingClientRect();
  return 'translate('+(fr.left-fin.left)+'px,'+(fr.top-fin.top)+'px) scale('+(fr.width/fin.width)+','+(fr.height/fin.height)+')';
}
function morphOpen(boxId,srcSel){
  if(reducedMotion())return;
  var box=document.getElementById(boxId);if(!box)return;
  var src=morphSrc(srcSel,box);if(!src)return;
  var bs=box.style,origCss=bs.cssText;
  box.classList.add('zjMorphHide');
  bs.transition='none';bs.transformOrigin='0 0';bs.willChange='transform';
  bs.transform=morphFlip(box,src);
  box.offsetWidth;
  bs.transition='transform '+MORPH_D+'ms '+MORPH_E;
  bs.transform='';
  var sh=document.createElement('div');sh.className='zjSheen';sh.style.animation='zjSweep '+Math.round(MORPH_D*1.4)+'ms 60ms cubic-bezier(.4,.2,.3,1) both';box.appendChild(sh);
  morphLock++;
  setTimeout(function(){box.classList.remove('zjMorphHide');box.classList.add('zjMorphShow');},MORPH_D*0.35);
  var fin1=false;
  function finOpen(){if(fin1)return;fin1=true;box.removeEventListener('transitionend',teOpen);
    if(sh.parentNode)sh.parentNode.removeChild(sh);
    box.classList.remove('zjMorphShow');box.classList.remove('zjMorphHide');
    bs.cssText=origCss;
    morphLock--;morphFlush();}
  function teOpen(e){if(e.target===box&&e.propertyName==='transform')setTimeout(finOpen,200);}
  box.addEventListener('transitionend',teOpen);
  setTimeout(finOpen,MORPH_D+1200);
}
function morphClose(boxId,srcSel,done){
  var box=document.getElementById(boxId);
  if(reducedMotion()||!box||morphBusy){done();return;}
  var src=morphSrc(srcSel,box);
  if(!src){done();return;}
  morphBusy=true;morphLock++;
  var bs=box.style;
  bs.transition='none';bs.transformOrigin='0 0';bs.willChange='transform,opacity';
  bs.transform='';
  box.offsetWidth;
  bs.transition='transform '+MORPH_D+'ms '+MORPH_E+',opacity 150ms '+(MORPH_D-170)+'ms';
  box.classList.add('zjMorphHide');
  bs.transform=morphFlip(box,src);
  bs.opacity='0';
  var fin2=false;
  function finClose(){if(fin2)return;fin2=true;box.removeEventListener('transitionend',teClose);
    morphBusy=false;morphLock--;done();morphFlush();}
  function teClose(e){if(e.target===box&&e.propertyName==='transform')finClose();}
  box.addEventListener('transitionend',teClose);
  setTimeout(finClose,MORPH_D+1200);
}

   输入栏紧贴键盘上沿，键盘收起后归零残留滚动，杜绝下方黑区 */
if(window.visualViewport){(function(){
  var vv=window.visualViewport,zjEl=null,t2=null,baseH=window.innerHeight;
  function typing(){var ae=document.activeElement;return !!(ae&&(ae.tagName==='TEXTAREA'||ae.tagName==='INPUT'));}
  window.addEventListener('resize',function(){if(!typing())baseH=window.innerHeight;});
  function vvFix(){
    zjEl=zjEl||document.getElementById('zj');if(!zjEl)return;
    var layoutResized=window.innerHeight<baseH-60; // 布局视口已随键盘自缩（安卓等）：浏览器处理
    var gap=Math.max(0,Math.round(window.innerHeight-vv.height)); // iOS：布局不缩，此值≈键盘总高
    if(typing()&&gap>60&&!layoutResized){
      var pb=gap+'px';
      if(zjEl.style.paddingBottom!==pb)zjEl.style.paddingBottom=pb; // 容器保持全屏，仅内容让位
      if(window.scrollY||vv.offsetTop>2)window.scrollTo(0,0);       // 顶住 iOS 的整页平移
    }else if(zjEl.style.paddingBottom||!typing()){
      if(zjEl.style.paddingBottom)zjEl.style.paddingBottom='';
      if(!typing()&&(window.scrollY||vv.offsetTop>2))window.scrollTo(0,0);
    }
  }
  vv.addEventListener('resize',function(){clearTimeout(t2);t2=setTimeout(vvFix,60);});
  vv.addEventListener('scroll',function(){clearTimeout(t2);t2=setTimeout(vvFix,60);});
  window.addEventListener('focusout',function(){setTimeout(vvFix,80);});
})();}
var rt,rw=window.innerWidth;window.addEventListener('resize',function(){var w=window.innerWidth,ae=document.activeElement,typing=ae&&(ae.tagName==='TEXTAREA'||ae.tagName==='INPUT');if(w===rw&&typing)return;/* 软键盘只改高度：输入中不重绘，避免关闭键盘 */rw=w;clearTimeout(rt);rt=setTimeout(render,150);});

try{sbxStartAll();}catch(e){}
// initial: if ST has chat already, pull it
if(TH.available){ pullHistory(function(){ if(S.history.length){S.screen='game';} render(); }); }
render();
glInit();
})();
</script>
