<html lang="zh"><head><meta charset="utf-8">
<title>克萝内</title>
<style>
  html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 25%,#3a3d4d,#22232d 70%);overflow:hidden;
    font-family:-apple-system,'PingFang SC',sans-serif}
  #stage{height:100vh;display:flex;justify-content:center;align-items:flex-start}
  #fit{transform-origin:50% 0}
  #char{position:relative;width:273px;height:1153px;animation:breath 4.6s ease-in-out infinite}
  #char img{position:absolute;user-select:none;-webkit-user-drag:none;

  #lean{position:absolute;inset:0;transition:transform .5s ease-out;transform-origin:136px 1145px}
  #sway{position:absolute;inset:0;transform-origin:136px 1145px;animation:bodysway 5.8s ease-in-out infinite}
  #headG{position:absolute;inset:0;transition:transform .35s ease-out;
    transform-origin:136px 184px}
  @keyframes breath{0%,100%{margin-top:0}50%{margin-top:3px}}
  @keyframes bodysway{0%,100%{transform:rotate(.6deg) translateX(2px)}50%{transform:rotate(-.6deg) translateX(-2px)}}
  #ui{position:fixed;left:16px;bottom:16px;z-index:9}
  button{background:#ffffff18;color:#dde;border:1px solid #ffffff40;border-radius:10px;padding:9px 18px;
    font-size:15px;cursor:pointer;backdrop-filter:blur(6px)}
  button:hover{background:#ffffff30}
  #tip{position:fixed;right:16px;bottom:16px;color:#99a;font-size:12px}
</style></head><body>

<div id="ui"><button id="talkBtn">开始说话</button></div>
<div id="tip">克萝内 · 眨眼 · 口型 · 伪3D视差</div>
<script>
const $=id=>document.getElementById(id);
const show=(id,on)=>{const e=$(id); if(e) e.style.display=on?'block':'none'};
const PX={nx:0,ny:0,tilt:0};
function applyPose(){
  const {nx,ny,tilt}=PX;
  $('headG').style.transform=`translate(${(nx*0).toFixed(1)}px,${(ny*0).toFixed(1)}px) rotate(${(nx*1.1+tilt).toFixed(2)}deg)`;
  $('lean').style.transform=`rotate(${(nx*1.8).toFixed(2)}deg) translate(${(nx*4).toFixed(1)}px,0)`;
}
document.addEventListener('mousemove',e=>{
  PX.nx=e.clientX/innerWidth-0.5; PX.ny=e.clientY/innerHeight-0.5;
  applyPose();
});
setInterval(()=>{ if(Math.random()>0.35) return;
  PX.tilt=(Math.random()<0.5?-1:1)*(2.5+Math.random()*2); applyPose();
  setTimeout(()=>{PX.tilt=0;applyPose();},1300+Math.random()*800);
},11000);
let talking=false, mouth='base', talkT=null;
function applyFace(){
  show('headBase',true);
  show('headHalf',mouth==='half');
  show('headOpen',false);
}
function blink(){
  show('headBlink',true); show('headHalf',false);
  setTimeout(()=>{show('headBlink',false); applyFace();},130);
  setTimeout(blink, 2400+Math.random()*3200);
}
setTimeout(blink,1600);
function setTalking(on){
  if(on===talking)return;
  talking=on;
  $('talkBtn').textContent=talking?'停止说话':'开始说话';
  if(talking){(function cyc(){
    if(!talking){mouth='base';applyFace();return}
    mouth=Math.random()<0.45?'base':'half';
    applyFace();
    talkT=setTimeout(cyc,100+Math.random()*140);
  })()} else {clearTimeout(talkT);mouth='base';applyFace();}
}
$('talkBtn').onclick=()=>setTalking(!talking);
// ---- 剧场模式 ----
const VN=/[?&]vn=1/.test(location.search);
if(VN){
  $('ui').style.display='none';$('tip').style.display='none';
  document.documentElement.style.background='transparent';
  document.body.style.background='transparent';
}
addEventListener('message',e=>{
  const d=e.data||{};
  if(d.vn!=='mitsuba')return;
  if(d.act==='talk')setTalking(!!d.on);
});
function fit(){
  const s=Math.min(innerHeight/1153, innerWidth/273)*0.96;
  $('fit').style.transform=`scale(${s})`;
}
addEventListener('resize',fit);fit();
</script></body></html>
