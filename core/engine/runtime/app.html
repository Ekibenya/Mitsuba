  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

      const entry = manifest[uuid];

              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {

          }

          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });

        }

        const blob = new Blob([], { type: entry.mime });

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

      }

      old.replaceWith(s);

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);

Fspan><\u002Ffooter>\n<\u002Fdiv>\n<textarea id=\"__nr\" style=\"display:none\">【时间点】大轮历587年盛夏／第3卷·EPISODE2「ローゼリア独裁宣言」\n【地点】首都贝尔·宫殿·广场侧的大厅\n【{{user}}扮演】三叶・克劳伯（13岁，罗泽利亚共和国·国家代表——自称总统）\n【局势】王冠已经到手。你废止王政、宣布罗泽利亚共和国成立，刚刚在宫殿广场上发表了「二十年限定」的独裁宣言——任期至大轮历六〇七年。广场上不是王都、而是首都的各位，陷入了狂热。\n\n「三叶大人万岁！！」「共和国万岁！！」「总统阁下万岁——！！」\n\n　欢呼的声浪隔着宫殿的石墙涌进来，震得吊灯上的水晶叮叮作响。狂热得简直像某种祭典。或者某种宗教。\n\n　大厅里，桑德拉抱着一摞文件，用看某种不可理喻之物的眼神盯着广场的方向，太阳穴一跳一跳的。「二十年限定的独裁……亏你想得出这种词。正常的共和主义者会气死的。」她小声嘟哝着，笔尖已经开始在文件上飞快地列条目——内阁名单、全权委任法、货币改革，要做的事情堆成了山。\n\n　克萝内靠在窗边，红发被广场的风吹得乱七八糟，咧着嘴笑：「喂，小不点。听说你打算把空缺的职位分一分？我可先说好，名字太长的官职我念不顺。」\n\n　角落里，尼可所长优雅地啜着不知从哪里弄来的红茶，笑得像只偷到奶油的猫。「啊哈哈哈，真是精彩的演讲！尤其是结婚那段，我笑得差点从椅子上掉下去。接下来呢？我们伟大的总统阁下，第一道政令打算颁布什么？」\n\n　广场上，「三叶大人万岁」的声浪还在一波一波地拍打着宫殿。\n\n<\u002Ftextarea>\n<textarea id=\"__sb\" style=\"display:none\">{\"时间\":{\"卷\":\"第3卷·EP2\",\"日期\":\"大轮历587年·盛夏\",\"时刻\":\"午后\",\"天气\":\"晴\",\"地点\":\"首都贝尔·宫殿·广场侧大厅\"},\"主角\":{\"名\":\"三叶·克劳伯\",\"身份\":\"罗泽利亚共和国总统（13岁）\",\"状态\":\"心情极好。演讲喊得喉咙有点干\",\"服装\":\"宣言用的黑色正装（缎带有点痒）\",\"持有\":[\"王冠（刚到手）\",\"炸点心（半袋）\"],\"心声\":\"二十年之后的事，就交给二十年之后的我考虑吧。现在——点心。\",\"无聊\":5,\"诅咒\":20,\"人格\":{\"稳健\":45,\"享乐\":40,\"激进\":15}},\"声望\":{\"首都市民\":95,\"旧贵族\":-90,\"军队\":40,\"议会\":20},\"在场\":[{\"名\":\"桑德拉\",\"身份\":\"国民议会议长\",\"状态\":\"抱着一摞文件，太阳穴一跳一跳\",\"好感\":85,\"畏惧\":10,\"心声\":\"内阁名单、全权委任法、货币改革……在她闯祸之前全部铺好。\"},{\"名\":\"克萝内\",\"身份\":\"军团长候补·红发\",\"状态\":\"靠在窗边咧嘴笑，红发被广场的风吹乱\",\"好感\":90,\"畏惧\":0,\"心声\":\"这家伙当了总统也还是小不点。挺好。\"},{\"名\":\"尼可所长\",\"身份\":\"魔术研究所所长\",\"状态\":\"啜着红茶，笑得像偷到奶油的猫\",\"好感\":60,\"畏惧\":0,\"心声\":\"接下来会变成怎样呢？啊哈哈，真令人期待。\"}],\"编年史\":[{\"时\":\"585年春\",\"事\":\"沉睡十年的公爵遗孤苏醒\",\"态\":\"已\"},{\"时\":\"586年\",\"事\":\"贝里埃要塞防卫战·战败\",\"态\":\"已\"},{\"时\":\"587年6月6日\",\"事\":\"政变。王冠易手\",\"态\":\"已\"},{\"时\":\"587年盛夏\",\"事\":\"共和国成立·二十年限定独裁宣言\",\"态\":\"今\"},{\"时\":\"不久之后\",\"事\":\"宫廷深处，有旧时代的影子在磨牙\",\"态\":\"将\"}],\"列国\":[{\"国\":\"罗泽利亚共和国\",\"况\":\"废止王政。狂热与断头台并行，粮价渐稳\"},{\"国\":\"普尔梅尼亚帝国\",\"况\":\"东境宿敌。战和未定，边境陈兵\"},{\"国\":\"莉莉亚王国\",\"况\":\"西方殖民强国。安静得可疑\"}],\"要闻\":[\"号外——二十年限定独裁宣言！广场三万人齐呼万岁，水晶吊灯受灾\",\"《赞颂三叶大人之歌》乐谱加印第七版，作者 dparts.push(T[\"时刻\"]);\nif(T[\"天气\"])dparts.push(\"天候·\"+T[\"天气\"]);\nif(T[\"地点\"])dparts.push(T[\"地点\"]);\nif(!dparts.length)dparts=[\"———\"];\ndocument.getElementById(\"dateline\").innerHTML=dparts.map(function(p){return \"<b>\"+esc(p)+\"<\u002Fb>\"}).join('<span class=\"sep\">❖<\u002Fspan>');\n\n/* ---- narrative ---- */\nvar nr=(document.getElementById(\"__nr\").value||\"\").trim();\nfunction prose(t){\n  var out=\"\",lines=t.split(/\\n/),buf=[];\n  function flush(){\n    if(!buf.length)return;\n    var para=buf.join(\"\\n\").trim();buf=[];\n    if(!para)return;\n    if(isFleuron(para)){out+='<span class=\"flr\">❖ ❖ ❖<\u002Fspan>';return}\n    var plines=para.split(\"\\n\");\n    var allNotice=true,k;\n    for(k=0;k<plines.length;k++){if(plines[k].trim()&&!/^【/.test(plines[k].trim()))allNotice=false}\n    if(/^【[^】]+】/.test(para)&&allNotice){\n      out+='<div class=\"notice\"><span class=\"nlab\">Proclamation · 布告<\u002Fspan>'+plines.map(function(l){return esc(l.trim())}).join(\"<br>\")+'<\u002Fdiv>';return;\n    }\n    plines.forEach(function(l){\n      l=rtrim(l);if(!l.trim())return;\n      if(isFleuron(l)){out+='<span class=\"flr\">❖ ❖ ❖<\u002Fspan>';return}\n      var cls=/^[\\s　]*[「『]/.test(l)?' class=\"dlg\"':'';\n      out+=\"<p\"+cls+\">\"+esc(l)+\"<\u002Fp>\";\n    });\n  }\n  lines.forEach(function(l){if(l.trim()===\"\"){flush()}else{buf.push(l)}});\n  flush();\n  return out||'<p class=\"err\">— 幕布尚未升起 —<\u002Fp>';\n}\n\n/* ---- gauges ---- */\nfunction grow(label,val,color){\n  val=num(val,0,100);\n  return '<div class=\"grow\"><span class=\"gl\">'+esc(label)+'<\u002Fspan><span class=\"bar\"><span style=\"width:'+val+'%;background:'+color+'\"><\u002Fspan><\u002Fspan><span class=\"gv\">'+val+'<\u002Fspan><\u002Fdiv>';\n}\nfunction reprow(label,val){\n  val=num(val,-100,100);\n  var w=Math.abs(val)/2, css=val>=0?'left:50%;width:'+w+'%;background:var(--blue)':'right:50%;width:'+w+'%;background:var(--red)';\n  return '<div class=\"reprow\"><span class=\"gl\">'+esc(label)+'<\u002Fspan><span class=\"repbar\"><span style=\"'+css+'\"><\u002Fspan><\u002Fspan><span class=\"gv\">'+(val>0?\"+\":\"\")+val+'<\u002Fspan><\u002Fdiv>';\n}\n\n/* ---- self tab ---- */\nfunction selfTab(){\n  var h='<div class=\"self\"><div class=\"portrait char_avatar char-avatar\"><span class=\"pl\">肖 像<\u002Fspan><\u002Fdiv><div>';\n  h+='<div class=\"kv\"><span class=\"slab\">Nom · 姓名<\u002Fspan><span class=\"v\">'+esc(PC[\"名\"]||\"？\")+(PC[\"身份\"]?'　<span style=\"font-size:11.5px;color:var(--faint)\">'+esc(PC[\"身份\"])+'<\u002Fspan>':'')+'<\u002Fspan><\u002Fdiv>';\n  if(PC[\"状态\"])h+='<div class=\"kv\"><span class=\"slab\">État · 状态<\u002Fspan><span class=\"v\">'+esc(PC[\"状态\"])+'<\u002Fspan><\u002Fdiv>';\n  if(PC[\"服装\"])h+='<div class=\"kv\"><span class=\"slab\">Tenue · 服装<\u002Fspan><span class=\"v\">'+esc(PC[\"服装\"])+'<\u002Fspan><\u002Fdiv>';\n  var items=Array.isArray(PC[\"持有\"])?PC[\"持有\"]:[];\n  if(items.length)h+='<div class=\"kv\"><span class=\"slab\">Effets · 持有<\u002Fspan><span class=\"chips\">'+items.map(function(i){return '<span class=\"chip\">'+esc(i)+'<\u002Fspan>'}).join(\"\")+'<\u002Fspan><\u002Fdiv>';\n  h+='<\u002Fdiv><\u002Fdiv>';\n  if(PC[\"心声\"])h+='<div class=\"voice\">'+esc(PC[\"心声\"])+'<\u002Fdiv>';\n  var P=PC[\"人格\"];\n  if(P&&typeof P===\"object\"){\n    var a=num(P[\"稳健\"],0,100),b=num(P[\"享乐\"],0,100),c=num(P[\"激进\"],0,100),s=(a+b+c)||1;\n    h+='<div class=\"tri\"><span class=\"slab\">Triumvirat · 三头制议席<\u002Fspan>'\n      +'<div class=\"tribar\" style=\"margin-top:5px\"><span class=\"a\" style=\"width:'+(a/s*100)+'%\"><\u002Fspan><span class=\"b\" style=\"width:'+(b/s*100)+'%\"><\u002Fspan><span class=\"c\" style=\"width:'+(c/s*100)+'%\"><\u002Fspan><\u002Fdiv>'\n      +'<div class=\"trileg\"><span class=\"la\">稳健派 <em>'+a+'<\u002Fem><\u002Fspan><span class=\"lb\">享乐派 <em>'+b+'<\u002Fem><\u002Fspan><span class=\"lc\">激进派 <em>'+c+'<\u002Fem><\u002Fspan><\u002Fdiv><\u002Fdiv>';\n  }\n  var g=\"\";\n  if(PC[\"无聊\"]!=null)g+=grow(\"退屈度\",PC[\"无聊\"],\"var(--gold)\");\n  if(PC[\"诅咒\"]!=null)g+=grow(\"诅咒活性\",PC[\"诅咒\"],\"var(--violet)\");\n  if(g)h+='<div style=\"margin-top:12px\"><span class=\"slab\">Mesures · 计器<\u002Fspan><div style=\"margin-top:4px\">'+g+'<\u002Fdiv><\u002Fdiv>';\n  if(REP&&typeof REP===\"object\"){\n    var rows=Object.keys(REP).map(function(k){return reprow(k,REP[k])}).join(\"\");\n    if(rows)h+='<div class=\"rep\"><span class=\"slab\">Réputation · 声望<\u002Fspan><div style=\"margin-top:4px\">'+rows+'<\u002Fdiv><\u002Fdiv>';\n  }\n  return h;\n}\n\n/* ---- cast tab ---- */\nfunction castTab(){\n  if(!CAST.length)return '<p class=\"err\">— 此刻无人在场 —<\u002Fp>';\n  return '<div class=\"cast\">'+CAST.map(function(n){\n    var h='<div class=\"npc\"><div class=\"npc-h\"><b>'+esc(n[\"名\"]||\"？\")+'<\u002Fb><span>'+esc(n[\"身份\"]||\"\")+'<\u002Fspan><\u002Fdiv>';\n    if(n[\"状态\"])h+='<div class=\"npc-s\">'+esc(n[\"状态\"])+'<\u002Fdiv>';\n    if(n[\"好感\"]!=null)h+=grow(\"好感\",n[\"好感\"],\"var(--red)\");\n    if(n[\"畏惧\"]!=null)h+=grow(\"畏惧\",n[\"畏惧\"],\"var(--violet)\");\n    if(n[\"心声\"])h+='<details><summary>启封 · 窃听心声<\u002Fsummary><p>'+esc(n[\"心声\"])+'<\u002Fp><\u002Fdetails>';\n    return h+'<\u002Fdiv>';\n  }).join(\"\")+'<\u002Fdiv>';\n}\n\n/* ---- chronicle tab ---- */\nfunction chronTab(){\n  var h='<div class=\"chron-date\"><div class=\"sm\">Chronique de la Grande Roue<\u002Fdiv><div class=\"big\">'+esc(T[\"日期\"]||\"———\")+'<\u002Fdiv><div class=\"sm\">'+esc((T[\"时刻\"]||\"\")+(T[\"天气\"]?\"　天候·\"+T[\"天气\"]:\"\"))+'<\u002Fdiv><\u002Fdiv>';\n  if(TL.length){\n    h+='<ol class=\"tl\">'+TL.map(function(e){\n      var st=e[\"态\"]||\"已\", cls=st===\"今\"?\"now\":(st===\"将\"?\"fut\":\"\");\n      return '<li class=\"'+cls+'\"><span class=\"tw\">'+esc(e[\"时\"]||\"\")+(st===\"今\"?\"　─ 现在\":(st===\"将\"?\"　─ 预兆\":\"\"))+'<\u002Fspan><span class=\"te\">'+esc(e[\"事\"]||\"\")+'<\u002Fspan><\u002Fli>';\n    }).join(\"\")+'<\u002Fol>';\n  }else h+='<p class=\"err\">— 史册空白 —<\u002Fp>';\n  return h;\n}\n\n/* ---- gazette tab ---- */\nfunction gazTab(){\n  var h=\"\";\n  if(NEWS.length){\n    h+='<div class=\"rule-h\"><span>邸报要闻<\u002Fspan><\u002Fdiv><div class=\"heads\">';\n    NEWS.forEach(function(n,i){h+=i===0?'<div class=\"head1\">'+esc(n)+'<\u002Fdiv>':'<div class=\"headn\">'+esc(n)+'<\u002Fdiv>'});\n    h+='<\u002Fdiv>';\n  }\n  if(NAT.length){\n    h+='<div class=\"rule-h\"><span>列国志<\u002Fspan><\u002Fdiv><table class=\"nations\">'+NAT.map(function(n){\n      return '<tr><td>'+esc(n[\"国\"]||\"\")+'<\u002Ftd><td>'+esc(n[\"况\"]||\"\")+'<\u002Ftd><\u002Ftr>';\n    }).join(\"\")+'<\u002Ftable>';\n  }\n  if(!h)h='<p class=\"err\">— 今日无报 —<\u002Fp>';\n  return h;\n}\n\n/* ---- stage tab ---- */\nfunction stageTab(){\n  var h='<div class=\"prose\">'+prose(nr)+'<\u002Fdiv>';\n  var R=[\"Ⅰ\",\"Ⅱ\",\"Ⅲ\",\"Ⅳ\",\"Ⅴ\",\"Ⅵ\"];\n  h+='<div class=\"choices\">';\n  if(OPT.length){\n    h+='<div class=\"chead\"><span>抉择<\u002Fspan><\u002Fdiv>';\n    OPT.slice(0,6).forEach(function(o,i){\n      h+='<button class=\"choice\" data-c=\"'+esc(o)+'\"><span class=\"num\">'+R[i]+'<\u002Fspan><span>'+esc(o)+'<\u002Fspan><\u002Fbutton>';\n    });\n    h+='<div class=\"cnote\">─ 点选后可在下方修改，亦可全然无视，自行书写 ─<\u002Fdiv>';\n  }\n  h+='<div class=\"quill\"><span class=\"qlab\">Votre Action · 你的行动<\u002Fspan>'\n    +'<textarea id=\"act\" placeholder=\"写下你的行动、台词或心声……\"><\u002Ftextarea>'\n    +'<div class=\"qbtns\"><button class=\"qbtn\" id=\"b-copy\">誊入输入栏<\u002Fbutton><button class=\"qbtn primary\" id=\"b-send\">直接上演 ▸<\u002Fbutton><\u002Fdiv>'\n    +'<div class=\"qhint\" id=\"qhint\"><\u002Fdiv><\u002Fdiv>';\n  h+='<\u002Fdiv>';\n  return h;\n}\n\n/* ---- assemble tabs ---- */\nvar tabs=[[\"stage\",\"剧幕\",\"Acte\",stageTab]];\ntabs.push([\"self\",\"人偶\",\"La Poupée\",selfTab]);\nif(CAST.length)tabs.push([\"cast\",\"在场\",\"Personae\",castTab]);\nif(TL.length||T[\"日期\"])tabs.push([\"chron\",\"编年史\",\"Chronique\",chronTab]);\nif(NEWS.length||NAT.length)tabs.push([\"gaz\",\"邸报\",\"Gazette\",gazTab]);\n\nvar nav=document.getElementById(\"tabs\"),main=document.getElementById(\"main\");\nmain.innerHTML=\"\";\ntabs.forEach(function(t){\n  var b=document.createElement(\"button\");\n  b.innerHTML=\"<b>\"+t[1]+\"<\u002Fb><i>\"+t[2]+\"<\u002Fi>\";\n  b.onclick=function(){show(t[0])};b.dataset.t=t[0];\n  nav.appendChild(b);\n  var s=document.createElement(\"section\");\n  s.id=\"p-\"+t[0];s.innerHTML=t[3]();\n  main.appendChild(s);\n});\nfunction show(id){\n  var bs=nav.querySelectorAll(\"button\"),ss=main.querySelectorAll(\"section\"),i;\n  for(i=0;i<bs.length;i++)bs[i].classList.toggle(\"on\",bs[i].dataset.t===id);\n  for(i=0;i<ss.length;i++)ss[i].classList.toggle(\"on\",ss[i].id===\"p-\"+id);\n}\nshow(\"stage\");\n\n/* ---- interactions ---- */\nfunction slashSafe(t){return t.replace(/\\|/g,\"\\\\|\").replace(/\\n+/g,\" \")}\nfunction hint(t){var q=document.getElementById(\"qhint\");if(q){q.textContent=t;setTimeout(function(){q.textContent=\"\"},4000)}}\nmain.addEventListener(\"click\",function(ev){\n  var btn=ev.target.closest?ev.target.closest(\".choice\"):null;\n  if(btn){\n    var t=btn.getAttribute(\"data-c\")||\"\";\n    var bs=main.querySelectorAll(\".choice\"),i;\n    for(i=0;i<bs.length;i++)bs[i].classList.remove(\"sel\");\n    btn.classList.add(\"sel\");\n    var ta=document.getElementById(\"act\");\n    if(ta){ta.value=t;ta.focus()}\n    return;\n  }\n  var id=ev.target&&ev.target.id;\n  if(id===\"b-copy\"||id===\"b-send\"){\n    var ta2=document.getElementById(\"act\");\n    var v=ta2?ta2.value.trim():\"\";\n    if(!v){hint(\"先写点什么，或点选上方的抉择。\");return}\n    try{\n      if(typeof triggerSlash!==\"function\"){hint(\"未检测到酒馆助手接口——请手动复制到输入栏。\");return}\n      if(id===\"b-copy\"){\n        triggerSlash(\"/setinput \"+slashSafe(v));\n        hint(\"已誊入下方输入栏，按发送键上演。\");\n      }else{\n        var p=triggerSlash(\"/send \"+slashSafe(v));\n        if(p&&p.then){p.then(function(){return triggerSlash(\"/trigger\")}).catch(function(){hint(\"递交失败——请改用『誊入输入栏』。\")})}\n        else{triggerSlash(\"/trigger\")}\n        hint(\"已递交，好戏开演……\");\n        if(ta2)ta2.value=\"\";\n      }\n    }catch(e){hint(\"递交失败——请改用『誊入输入栏』。\")}\n  }\n});\n}catch(e){\n  console.info(\"[三叶剧场] 脚本错误:\",e);\n  showFatal(e&&e.message?e.message:e);\n}\n}\nif(document.readyState===\"loading\"){document.addEventListener(\"DOMContentLoaded\",boot)}else{boot()}\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
